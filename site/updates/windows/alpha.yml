  "releaseNotes": "# ChatGPT Studio · Windows alpha.24\n\n本次仅更新 Windows x64，macOS 继续 alpha.23，Android 继续 alpha.22。\n\n- 新装默认目录、主程序和卸载程序统一使用 ChatGPT Studio。\n- 经过身份与文件校验的旧默认程序目录安全迁移到 Studio；自定义安装目录保留原位置。\n- 同步更新桌面、开始菜单和已有快捷方式目标，更新器兼容旧、新程序名。\n- 修正更新提示中的旧品牌文案，保留既有登录、加密恢复身份及标签保活策略。\n- 安装遇到目标占用或未知文件时拒绝覆盖；迁移失败支持程序和注册信息回退。\n\n安装前从应用菜单退出旧版，无需卸载或删除账号数据。用户数据目录仍使用 `ChatGPT Profiles`，这是保留登录和恢复数据的兼容身份，不是遗漏更名。EXE 支持当前用户安装后的确认更新；ZIP 为免安装手动替换。完整应用更新需要重启。\n\n安装包未做 Windows 代码签名，可能出现 SmartScreen 或未知发布者提示。请核对 `SHA256SUMS.windows.txt`。\n\n验证：复用 Actions 41975812832 的原始 EXE/ZIP；完整 `npm run check` 通过，106 项单元测试中 105 通过、1 项平台跳过。六项安装、升级、合成页面存储与失败回退验收通过。没有截图、真实 ChatGPT 或真实账号验收；任务栏固定快捷方式目标已验证，Explorer 图标缓存外观未验证。\n",
