  "releaseNotes": "# ChatGPT Studio · 2026.11.9\n\n本批将 macOS、Windows 和常规 Android 统一到一个正常 Release，官网每个平台只有一个最新下载入口。历史 Beta 与预发布保留在 Release 历史，不再作为并列推荐。\n\n## 本次内容\n\n- macOS / Windows 使用日期版本 `2026.11.9`；沿用独立账号、标签切换不重载、后台保活、资产库与 Skill 任务、加密恢复和更新进度。\n- 关闭含密码或一次性验证码输入字段的标签时，不保留该标签的内存实例；不会清除账号 Cookie、登录空间或已存恢复记录。普通标签的关闭恢复与后台保活策略保持。\n- Windows 的程序、默认安装目录、卸载程序和快捷方式继续使用 Studio，旧默认目录经过校验迁移，自定义目录保留，失败支持回退。\n- 常规 Android 使用已验收的原签 `2026.11.08-1923`（versionCode 3000035）原始字节，沿用 `com.forcemind.chatgpt.profiles`，可覆盖 alpha.22，无需卸载。新增账号可选独立语言和时区，既有账号保留原 WebView 与登录；包含双内核页面恢复、顶部可点选标签、刷新、强制刷新、后退/前进、VLESS 同路由、文件和 Skill 任务。\n- 官网移除额外 Android Beta/候选面板及需要登录的临时 Actions 下载地址，正常下载使用公开 Release 附件，并保留可选第三方国内加速。\n\n## 安装与兼容\n\n先从应用菜单退出旧版再覆盖安装；不要删除用户数据或先卸载 Android。独立 Beta 是另一个包名和数据空间，本包不会自动搬迁它的数据。\n\nmacOS 构建仅 Apple Silicon，临时签名、未做 Apple 公证；Windows x64 未配置 Authenticode。正式发布渠道不代表已取得平台签名或商店审核。完整桌面程序更新需要重启；Android 仍手动安装。\n\n## 验证边界\n\nWindows Server 2025 x64 通过 105 项单元（1 平台跳过）、14 项迁移版本检查、20 项 E2E（23 平台专用跳过）、六项安装迁移、原生启动/卸载保留数据、alpha.18 更新器升级及 8 标签 330,276 ms 后台留存。Mac 15.8.2 arm64 已通过 106 项单元与 25 项页面验收（1 项 Windows 专用跳过），以及包内恢复、菜单栏和两种 ZIP 的升级验证。构建与合成页面、安装升级验证均在 GitHub Actions；实际运行、数量和文件 SHA-256 以同目录 `2026.11.9.json` 与三平台发布记录为准。本批必需门禁已通过，原失败及根因修正保留在三平台发布记录。\n\nAndroid 复用已通过的 Android 9 / 15 模拟器完整功能与原证书覆盖升级证据，核对 UID、Cookie/网站存储、资产、加密草稿和恢复记录保留；ARM64 出包与 x86_64 验收代码一致性单列，不冒充 ARM64 手机安装验收。\n\n未访问真实 ChatGPT、个人账号或真实代理节点；厂商手机、真实附件发送、语音、登录提供方与节点兼容仍待真实环境验收。历史 TLS reset、首次连接与输入警告存在尚未完全归因的记录，不能把一次合成通过写成根因全部解决。应用层一次发送也不保证网络或第三方服务端只执行一次。\n\niPhone/iPad 暂无安装包，不在本批范围；系统后台挂起限制需要通过前台页面保留、本地状态恢复和受系统管理的后台任务设计处理，不承诺网页无限后台驻留。\n",
