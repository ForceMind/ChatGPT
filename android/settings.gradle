pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        if (providers.gradleProperty('environmentPoc').isPresent()) {
            maven { url 'https://maven.mozilla.org/maven2/'; content { includeGroup 'org.mozilla.geckoview' } }
        }
    }
}
rootProject.name = 'ChatGPT Profiles'
include ':app'
// Explicit opt-in; the experimental engine never enters the shipping app.
if (providers.gradleProperty('environmentPoc').isPresent()) include ':environment-poc'
