pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application' && settings.providers.gradleProperty('environmentClient').isPresent())
                useModule('com.android.tools.build:gradle:9.1.1')
        }
    }
}
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral(); maven { url 'https://maven.mozilla.org/maven2/'; content { includeGroup 'org.mozilla.geckoview' } } } }
rootProject.name = 'ChatGPT Profiles'
include ':app'
