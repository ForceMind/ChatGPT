plugins { id 'com.android.application' version '9.1.1' }
def pocOptimization = providers.gradleProperty('pocOptimization').getOrElse('baseline')
def resourceTuning = providers.gradleProperty('pocResourceTuning').getOrElse('baseline')
if (!(resourceTuning in ['baseline','optimized'])) throw new GradleException('Unknown PoC resource tuning')
if (!(pocOptimization in ['baseline', 'r8', 'resources'])) throw new GradleException('Unknown isolated release optimization mode')
def pocAbis = providers.gradleProperty('pocAbis').getOrElse('arm64-v8a,x86_64').split(',') as List
if (pocAbis.isEmpty() || pocAbis.toSet().size() != pocAbis.size() || !pocAbis.every { it in ['arm64-v8a', 'x86_64'] }) throw new GradleException('Unknown isolated ABI')
android {
    namespace 'com.forcemind.chatgpt.environmentpoc'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    defaultConfig {
        buildConfigField 'boolean', 'RESOURCE_TUNED', (resourceTuning == 'optimized').toString()
        applicationId 'com.forcemind.chatgpt.environmentpoc'
        // Compatibility probes may lower only this isolated app's declared API.
        // Library manifest requirements remain enforced by the normal merger.
        minSdk providers.gradleProperty('pocMinSdk').map { Integer.parseInt(it) }.getOrElse(29)
        targetSdk 36
        versionCode 1
        versionName '0.1-poc'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled = pocOptimization != 'baseline'
            shrinkResources = pocOptimization == 'resources'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    splits { abi { enable true; reset(); include(*pocAbis); universalApk false } }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945' }
tasks.register('copyPocIcon', Copy) {
    from '../app/src/main/res'
    include 'drawable/ic_launcher_foreground.xml', 'mipmap-anydpi-v26/ic_launcher.xml', 'mipmap-anydpi-v33/ic_launcher.xml', 'values/launcher.xml'
    into layout.buildDirectory.dir('generated/poc-res')
}
// The preBuild dependency above explicitly orders generation. AGP 9 requires
// a concrete path here rather than an ambiguous directory Provider.
android.sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/poc-res').get().asFile)
tasks.named('preBuild').configure { dependsOn 'copyPocIcon' }
