plugins { id 'com.android.application' version '9.1.1' }
android {
    namespace 'com.forcemind.chatgpt.environmentpoc'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    defaultConfig {
        applicationId 'com.forcemind.chatgpt.environmentpoc'
        // Compatibility probes may lower only this isolated app's declared API.
        // Library manifest requirements remain enforced by the normal merger.
        minSdk providers.gradleProperty('pocMinSdk').map { Integer.parseInt(it) }.getOrElse(29)
        targetSdk 36
        versionCode 1
        versionName '0.1-poc'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945' }
tasks.register('copyPocIcon', Copy) {
    from '../app/src/main/res'
    include 'drawable/ic_launcher_foreground.xml', 'mipmap-anydpi-v26/ic_launcher.xml', 'mipmap-anydpi-v33/ic_launcher.xml', 'values/launcher.xml'
    into layout.buildDirectory.dir('generated/poc-res')
}
// The preBuild dependency above explicitly orders generation. AGP 9 requires
// a concrete path here rather than an ambiguous directory Provider.
android.sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/poc-res').get().asFile)
tasks.named('preBuild').configure { dependsOn 'copyPocIcon' }
