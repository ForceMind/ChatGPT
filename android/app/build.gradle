plugins { id 'com.android.application' }

// One Actions-generated minute is shared by every candidate ABI and CI mode.
// Never read the clock during Gradle configuration or reconstruct a reused version.
def androidVersionPath = project.findProperty('androidVersionFile') ?: System.getenv('STUDIO_ANDROID_VERSION_FILE')
def androidCandidateVersion = null
if (androidVersionPath) {
    def versionFile = new File(androidVersionPath.toString())
    if (!versionFile.isAbsolute()) versionFile = new File(rootProject.projectDir.parentFile, androidVersionPath.toString())
    if (!versionFile.isFile()) throw new GradleException('Missing shared Android version metadata')
    androidCandidateVersion = new groovy.json.JsonSlurper().parse(versionFile)
    if (androidCandidateVersion.schema != 1 || androidCandidateVersion.versionCode != 3000032 || androidCandidateVersion.timeZone != 'Asia/Shanghai'
            || !(androidCandidateVersion.versionName ==~ /\d{4}\.\d{2}\.\d{2}-\d{4}/) || !(androidCandidateVersion.sourceSHA ==~ /[a-f0-9]{40}/))
        throw new GradleException('Invalid Android candidate date version metadata')
    def formatter = java.time.format.DateTimeFormatter.ofPattern('uuuu.MM.dd-HHmm').withResolverStyle(java.time.format.ResolverStyle.STRICT)
    java.time.LocalDateTime.parse(androidCandidateVersion.versionName, formatter)
    if (project.hasProperty('betaVersionCode') && project.property('betaVersionCode').toInteger() != androidCandidateVersion.versionCode
            || project.hasProperty('betaVersionName') && project.property('betaVersionName') != androidCandidateVersion.versionName)
        throw new GradleException('Legacy beta properties differ from shared Android version metadata')
} else if (project.hasProperty('environmentClient')) {
    throw new GradleException('Environment candidates require -PandroidVersionFile or STUDIO_ANDROID_VERSION_FILE')
}

def signingFile = rootProject.file('keystore.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.forcemind.chatgpt.profiles'
    if (project.hasProperty('environmentClient')) {
        compileSdk { version = release(37) { minorApiLevel = 0 } }
    } else compileSdk 36
    defaultConfig {
        applicationId 'com.forcemind.chatgpt.profiles'
        minSdk 28
        targetSdk 36
        versionCode(androidCandidateVersion != null ? androidCandidateVersion.versionCode : 3000024)
        versionName(androidCandidateVersion != null ? androidCandidateVersion.versionName : '3.0.0-alpha.24-candidate.1')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'NETWORK_TEST', 'false'
        buildConfigField 'String', 'NETWORK_HOME_URL', '""'
        buildConfigField 'String', 'NETWORK_PROBE_URL', '""'
        buildConfigField 'boolean', 'ENVIRONMENT_CLIENT', project.hasProperty('environmentClient').toString()
        buildConfigField 'boolean', 'ENVIRONMENT_TEST', project.hasProperty('environmentTest').toString()
        buildConfigField 'boolean', 'ENVIRONMENT_NETWORK_TEST', project.hasProperty('environmentNetworkTest').toString()
        buildConfigField 'String', 'ENVIRONMENT_HOME_URL', project.hasProperty('environmentTest') ? (project.hasProperty('environmentNetworkTest') ? '"https://network-fixture.test:18480/c/a1"' : '"https://environment-fixture.test:18480/c/environment"') : '""'
    }
    signingConfigs {
        if (System.getenv('STUDIO_BETA_KEYSTORE_PATH')) {
            networkBetaKey {
                storeFile file(System.getenv('STUDIO_BETA_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('STUDIO_BETA_STORE_PASSWORD')
                keyAlias 'studio-beta'
                keyPassword System.getenv('STUDIO_BETA_STORE_PASSWORD')
            }
        }
        if (signingFile.exists()) {
            localRelease {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            if (signingFile.exists()) signingConfig signingConfigs.localRelease
            minifyEnabled false
            ndk { abiFilters 'arm64-v8a' }
        }
        networkBeta {
            initWith release
            applicationIdSuffix '.networkbeta'
            versionNameSuffix(androidCandidateVersion != null ? '' : '-beta.1')
            signingConfig System.getenv('STUDIO_BETA_KEYSTORE_PATH') ? signingConfigs.networkBetaKey : null
            debuggable false
            matchingFallbacks = ['release']
            ndk { abiFilters.clear(); abiFilters(project.findProperty('betaAbi') ?: 'arm64-v8a') }
        }
        networkPreview {
            initWith release
            applicationIdSuffix '.networkpreview'
            versionNameSuffix '-standalone'
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
            ndk { abiFilters 'arm64-v8a' }
        }
    }
        // Isolated, synthetic acceptance only; never installed over the public app.
        buildTypes { networkCi {
            initWith buildTypes.debug
            applicationIdSuffix '.networkci'
            versionNameSuffix '-network-ci'
            matchingFallbacks = ['debug']
            ndk { abiFilters 'x86_64' }
            buildConfigField 'boolean', 'NETWORK_TEST', 'true'
            buildConfigField 'String', 'NETWORK_HOME_URL', '"https://network-fixture.test:18480/joint/studio-home/page"'
            buildConfigField 'String', 'NETWORK_PROBE_URL', '"https://network-fixture.test:18480/echo"'
        }
        }
        testBuildType = (project.hasProperty('betaUpgrade') || project.hasProperty('betaBrowserUpgrade') || project.hasProperty('betaNetworkUi') || project.hasProperty('environmentClient')) ? 'networkBeta' : project.hasProperty('networkIntegration') ? 'networkCi' : 'debug'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
}
tasks.register('requireReleaseKey') {
    doLast { if (!signingFile.exists() && !project.hasProperty('unsignedRelease')) throw new GradleException('Release requires local keystore.properties. CI may explicitly use -PunsignedRelease for later local signing.') }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'requireReleaseKey' }
dependencies {
    implementation files('libs/networkcore.aar')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.30.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.30.0'
    implementation 'org.commonmark:commonmark-ext-autolink:0.30.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Retain combined dependency notices when conversion libraries share paths.
android.packaging.resources.merges += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']

// Only these verified project resources enter the mobile package.
def capabilityAssets = layout.buildDirectory.dir("generated/project-capabilities")
tasks.register('copyProjectCapabilities', Sync) {
    from rootProject.file('../desktop/resources/capabilities')
    include 'manifest.json', 'skills.json', 'desktop-manifest.json', 'desktop-capabilities.json'
    into capabilityAssets.map { it.dir('capabilities') }
}
android.sourceSets.main.assets.srcDir(capabilityAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn 'copyProjectCapabilities' }

android.testOptions.unitTests.all {
    systemProperty 'capabilityRoot', rootProject.file('../desktop/resources/capabilities').absolutePath
}

// CI-only trust is generated from the owned ephemeral fixture, never release assets.
if (project.hasProperty('networkIntegration')) {
    def fixture = rootProject.file('network-poc/secure-fixture/ca.pem')
    def generated = layout.buildDirectory.dir('generated/network-ci')
    tasks.register('prepareNetworkCiTrust') {
        inputs.file fixture
        outputs.dir generated
        doLast {
            def pem = fixture.getText('UTF-8')
            if (!pem.startsWith('-----BEGIN CERTIFICATE-----')) throw new GradleException('Missing owned CI CA')
            def root = generated.get().asFile
            def javaFile = new File(root, 'java/com/forcemind/chatgpt/profiles/GeneratedNetworkTrust.java')
            javaFile.parentFile.mkdirs()
            javaFile.text = 'package com.forcemind.chatgpt.profiles; public final class GeneratedNetworkTrust { public static final String PEM = ' + groovy.json.JsonOutput.toJson(pem) + '; }'
            def ca = new File(root, 'res/raw/studio_network_ci_ca.pem'); ca.parentFile.mkdirs(); ca.text = pem
        }
    }
    android.sourceSets.networkCi.java.srcDir('src/debug/java')
    android.sourceSets.networkCi.assets.srcDir('src/debug/assets')
    android.sourceSets.networkCi.res.srcDir('src/debug/res')
    android.sourceSets.networkCi.java.srcDir(generated.map { it.dir('java') })
    android.sourceSets.networkCi.res.srcDir(generated.map { it.dir('res') })
    tasks.matching { it.name == 'preNetworkCiBuild' }.configureEach { dependsOn 'prepareNetworkCiTrust' }
}

// Only the isolated long-lived beta has its own monotonically increasing code.
androidComponents.onVariants(androidComponents.selector().withBuildType('networkBeta')) { variant ->
    variant.outputs.each { output ->
        output.versionCode.set(androidCandidateVersion != null ? androidCandidateVersion.versionCode : (project.findProperty('betaVersionCode') ?: '3000025').toInteger())
        output.versionName.set(androidCandidateVersion != null ? androidCandidateVersion.versionName : (project.findProperty('betaVersionName') ?: '3.0.0-alpha.24-beta.1'))
    }
}
tasks.matching { it.name == 'preNetworkBetaBuild' }.configureEach {
    doFirst { if (!System.getenv('STUDIO_BETA_KEYSTORE_PATH')) throw new GradleException('Fixed beta signing is required; no debug fallback') }
}
if (project.hasProperty('betaUpgrade')) {
    android.sourceSets.networkBeta.manifest.srcFile('src/betaUpgradeTarget/AndroidManifest.xml')
    android.sourceSets.androidTest.java.setSrcDirs(['src/betaUpgrade/java'])
    android.sourceSets.androidTest.manifest.srcFile('src/betaUpgrade/AndroidManifest.xml')
}
if (project.hasProperty('betaBrowserUpgrade')) {
    android.sourceSets.androidTest.java.setSrcDirs(['src/betaBrowserUpgrade/java'])
    android.sourceSets.androidTest.manifest.srcFile('src/betaUpgrade/AndroidManifest.xml')
}
if (project.hasProperty('betaNetworkUi')) {
    android.sourceSets.androidTest.java.setSrcDirs(['src/betaNetworkUi/java'])
    android.sourceSets.androidTest.manifest.srcFile('src/betaUpgrade/AndroidManifest.xml')
}
if (project.hasProperty('environmentClient')) {
    dependencies.add('networkBetaImplementation', 'org.mozilla.geckoview:geckoview:158.0.20261021001945')
    android.sourceSets.networkBeta.java.srcDir('src/environmentClient/java')
    android.sourceSets.networkBeta.java.srcDir(project.hasProperty('environmentTest') ? 'src/environmentCi/java' : 'src/environmentProduction/java')
    def environmentAssets = layout.buildDirectory.dir('generated/environment-assets')
    tasks.register('copyEnvironmentAssets', Sync) {
        inputs.property('environmentTest', project.hasProperty('environmentTest'))
        inputs.property('environmentNetworkTest', project.hasProperty('environmentNetworkTest'))
        from 'src/environmentClient/assets'
        into environmentAssets
        doLast {
            if (project.hasProperty('environmentTest')) {
                def manifest = new File(environmentAssets.get().asFile,'studio-environment/manifest.json')
                def value = new groovy.json.JsonSlurper().parse(manifest)
                value.content_scripts[0].matches += [project.hasProperty('environmentNetworkTest') ? 'https://network-fixture.test/*' : 'https://environment-fixture.test/*']
                manifest.setText(groovy.json.JsonOutput.toJson(value),'UTF-8')
            }
        }
    }
    android.sourceSets.networkBeta.assets.srcDir(environmentAssets.get().asFile)
    tasks.matching { it.name == 'preNetworkBetaBuild' }.configureEach { dependsOn 'copyEnvironmentAssets' }
    android.sourceSets.networkBeta.manifest.srcFile('src/environmentClient/AndroidManifest.xml')
    android.sourceSets.androidTest.java.setSrcDirs(['src/environmentTest/java'])
    android.sourceSets.androidTest.manifest.srcFile('src/betaUpgrade/AndroidManifest.xml')
    if (project.hasProperty('environmentTest')) {
        // Merge the CI-only activity into the generated environment manifest, never the human APK.
        def generatedManifest = layout.buildDirectory.file('generated/environment-ci/AndroidManifest.xml')
        tasks.register('prepareEnvironmentCiManifest') {
            inputs.files('src/environmentClient/AndroidManifest.xml','src/environmentCi/AndroidManifest.xml')
            inputs.property('environmentNetworkTest', project.hasProperty('environmentNetworkTest'))
            outputs.file(generatedManifest)
            doLast {
                def base = file('src/environmentClient/AndroidManifest.xml').getText('UTF-8')
                def extra = file('src/environmentCi/AndroidManifest.xml').getText('UTF-8')
                def inner = extra.substring(extra.indexOf('<application>') + '<application>'.length(), extra.indexOf('</application>'))
                if (project.hasProperty('environmentNetworkTest')) {
                    base=base.replace('<application ', '<application android:networkSecurityConfig="@xml/studio_environment_network_security" ')
                    base=base.replace('tools:replace="android:label"','tools:replace="android:label,android:networkSecurityConfig"')
                    inner += '<provider android:name=".EnvironmentNetworkFilesProvider" android:authorities="${applicationId}.network-docs" android:exported="true" android:permission="android.permission.MANAGE_DOCUMENTS" android:grantUriPermissions="true"><intent-filter><action android:name="android.content.action.DOCUMENTS_PROVIDER" /></intent-filter></provider>'
                }
                def target = generatedManifest.get().asFile; target.parentFile.mkdirs()
                target.setText(base.replace('</application>', inner + '</application>'),'UTF-8')
            }
        }
        android.sourceSets.networkBeta.manifest.srcFile(generatedManifest.get().asFile)
        tasks.matching { it.name == 'preNetworkBetaBuild' }.configureEach { dependsOn 'prepareEnvironmentCiManifest' }
    }
}

// Exact owned CA/probe only in the Gecko network fixture. Human builds never add
// these sources, resources, destinations, or document-provider permissions.
if (project.hasProperty('environmentNetworkTest')) {
    if (!project.hasProperty('environmentClient') || !project.hasProperty('environmentTest')) throw new GradleException('Gecko network acceptance requires the isolated environment client fixture')
    android.buildTypes.networkBeta.buildConfigField 'boolean', 'NETWORK_TEST', 'true'
    android.buildTypes.networkBeta.buildConfigField 'String', 'NETWORK_HOME_URL', '"https://network-fixture.test:18480/c/a1"'
    android.buildTypes.networkBeta.buildConfigField 'String', 'NETWORK_PROBE_URL', '"https://network-fixture.test:18480/echo"'
    def ownedCa = rootProject.file('network-poc/secure-fixture/ca.pem')
    def trustRoot = layout.buildDirectory.dir('generated/environment-network-ci').get().asFile
    tasks.register('prepareEnvironmentNetworkTrust') {
        inputs.file ownedCa
        outputs.dir trustRoot
        doLast {
            def pem=ownedCa.getText('UTF-8')
            if (!pem.startsWith('-----BEGIN CERTIFICATE-----')) throw new GradleException('Missing owned Gecko network CA')
            def javaFile=new File(trustRoot,'java/com/forcemind/chatgpt/profiles/GeneratedNetworkTrust.java')
            javaFile.parentFile.mkdirs()
            javaFile.text='package com.forcemind.chatgpt.profiles; public final class GeneratedNetworkTrust { public static final String PEM = ' + groovy.json.JsonOutput.toJson(pem) + '; }'
            def ca=new File(trustRoot,'res/raw/studio_environment_network_ci_ca.pem');ca.parentFile.mkdirs();ca.text=pem
            def config=new File(trustRoot,'res/xml/studio_environment_network_security.xml');config.parentFile.mkdirs()
            config.text='<network-security-config><base-config cleartextTrafficPermitted="false" /><domain-config><domain includeSubdomains="false">network-fixture.test</domain><domain includeSubdomains="false">files.network-fixture.test</domain><trust-anchors><certificates src="system" /><certificates src="@raw/studio_environment_network_ci_ca" /></trust-anchors></domain-config></network-security-config>'
        }
    }
    android.sourceSets.networkBeta.java.srcDir(new File(trustRoot,'java'))
    android.sourceSets.networkBeta.res.srcDir(new File(trustRoot,'res'))
    tasks.matching { it.name == 'preNetworkBetaBuild' }.configureEach { dependsOn 'prepareEnvironmentNetworkTrust' }
}
