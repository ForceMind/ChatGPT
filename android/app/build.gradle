                storePassword System.getenv('STUDIO_REGULAR_CI_STORE_PASSWORD')
                keyAlias 'regular-compat-ci'
                keyPassword System.getenv('STUDIO_REGULAR_CI_STORE_PASSWORD')
            }
        }
        if (!regularEnvironmentClient && System.getenv('STUDIO_BETA_KEYSTORE_PATH')) {
            networkBetaKey {
                storeFile file(System.getenv('STUDIO_BETA_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('STUDIO_BETA_STORE_PASSWORD')
                keyAlias 'studio-beta'
                keyPassword System.getenv('STUDIO_BETA_STORE_PASSWORD')
            }
        }
        if (!regularEnvironmentClient && signingFile.exists()) {
            localRelease {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            buildConfigField 'boolean', 'APP_UPDATES_ENABLED', appUpdateCandidate.toString()
            buildConfigField 'boolean', 'APP_UPDATE_AUTO', appUpdateAuto.toString()
            buildConfigField 'boolean', 'APP_UPDATE_TEST', appUpdateTest.toString()
            buildConfigField 'String', 'APP_UPDATE_TEST_ORIGIN', appUpdateTest ? '"http://127.0.0.1:18777"' : '""'
            if (regularEnvironmentClient) signingConfig regularEnvironmentCi ? signingConfigs.regularCiKey : null
            else if (signingFile.exists()) signingConfig signingConfigs.localRelease
            minifyEnabled false
            if (appUpdateCandidate && !regularEnvironmentCi) {
