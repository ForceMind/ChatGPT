def regularEnvironmentCi = project.hasProperty('regularEnvironmentCi')
def environmentClient = project.hasProperty('environmentClient')
def environmentTest = project.hasProperty('environmentTest')
def appUpdateCandidate = project.hasProperty('appUpdateCandidate')
def appUpdateAuto = project.hasProperty('appUpdateAuto')
def appUpdateAcceptance = project.hasProperty('appUpdateAcceptance')
def appUpdateAcceptanceTarget = project.hasProperty('appUpdateAcceptanceTarget')
if (appUpdateAcceptance && !appUpdateAuto)
    throw new GradleException('Private update acceptance requires automatic updates')
if (appUpdateAcceptanceTarget && !appUpdateAcceptance)
    throw new GradleException('Private update target requires the acceptance candidate')
def appUpdateTest = project.hasProperty('appUpdateTest')
def appUpdateTestTarget = project.hasProperty('appUpdateTestTarget')
if (appUpdateAuto && !appUpdateCandidate)
    throw new GradleException('Automatic update candidate requires appUpdateCandidate')
if (appUpdateCandidate && !regularEnvironmentClient)
    throw new GradleException('App updates require the regular Android package')
if (appUpdateTest && (!appUpdateCandidate || !regularEnvironmentCi || !environmentTest || project.hasProperty('environmentNetworkTest')))
    throw new GradleException('App update fixtures require the separate regular CI variant')
if (appUpdateTestTarget && (!appUpdateCandidate || regularEnvironmentCi || environmentTest || System.getenv('GITHUB_ACTIONS') != 'true'))
    throw new GradleException('The synthetic install target is Actions-only')
def regularNavigationTest = project.hasProperty('regularNavigationTest')
def regularLegacyNetworkTest = project.hasProperty('regularLegacyNetworkTest')
def regularWorkbenchTest = project.hasProperty('regularWorkbenchTest')
if (regularWorkbenchTest && (!regularEnvironmentCi || !environmentTest || project.hasProperty('environmentNetworkTest')))
    throw new GradleException('Regular Workbench fixtures require the ordinary non-network CI target')
def originalSignatureTest = project.hasProperty('originalSignatureTest')
if (originalSignatureTest && (!regularEnvironmentCi || !environmentTest || regularNavigationTest || project.hasProperty('environmentNetworkTest')))
    throw new GradleException('Original-signature instrumentation is a separate, explicit CI source set')
def regularReviewAbi = project.findProperty('regularReviewAbi') ?: 'arm64-v8a'
if (project.hasProperty('regularReviewAbi') && (!regularEnvironmentClient || regularEnvironmentCi || System.getenv('GITHUB_ACTIONS') != 'true' || !(regularReviewAbi in ['arm64-v8a', 'x86_64'])))
    throw new GradleException('Unsigned review ABI is explicit and Actions-only')
if (regularLegacyNetworkTest && (!regularEnvironmentCi || !project.hasProperty('environmentNetworkTest')))
    throw new GradleException('Regular legacy network fixtures require the marked regular network CI target')
if (regularNavigationTest && (!regularEnvironmentCi || !environmentTest))
    throw new GradleException('Regular navigation is an explicit CI-only test source set')
if (regularEnvironmentClient && !environmentClient)
    throw new GradleException('Regular environment release requires -PenvironmentClient')
if (regularEnvironmentCi && (!regularEnvironmentClient || !environmentTest || project.hasProperty('unsignedRelease')))
    throw new GradleException('Regular CI requires regularEnvironmentClient + environmentTest, without unsignedRelease')
if (regularEnvironmentClient && !regularEnvironmentCi && (!project.hasProperty('unsignedRelease') || environmentTest))
    throw new GradleException('Human regular environment review requires unsignedRelease and no environmentTest')
if (regularEnvironmentClient && ['networkIntegration', 'betaUpgrade', 'betaBrowserUpgrade', 'betaNetworkUi'].any { project.hasProperty(it) })
    throw new GradleException('Regular release cannot include isolated Beta/network acceptance modes')
if (regularEnvironmentCi && (System.getenv('GITHUB_ACTIONS') != 'true' || !System.getenv('STUDIO_REGULAR_CI_KEYSTORE_PATH') || !System.getenv('STUDIO_REGULAR_CI_STORE_PASSWORD')))
    throw new GradleException('Regular CI requires an Actions-only ephemeral signing key')
if (regularEnvironmentClient && project.hasProperty('environmentNetworkTest') && !regularEnvironmentCi)
    throw new GradleException('Owned network trust is allowed only in the marked regular CI target')
if (regularNavigationTest && project.hasProperty('environmentNetworkTest'))
    throw new GradleException('Navigation and network fixtures use distinct CI APKs')
def environmentBuildType = regularEnvironmentClient ? 'release' : 'networkBeta'
def environmentPreBuild = regularEnvironmentClient ? 'preReleaseBuild' : 'preNetworkBetaBuild'
def expectedCandidateVersionCode = appUpdateAcceptance ? ((appUpdateAcceptanceTarget || appUpdateTestTarget) ? 3000040 : 3000039) : regularEnvironmentClient ? (appUpdateCandidate ? (appUpdateAuto ? (appUpdateTestTarget ? 3000043 : 3000042) : (appUpdateTestTarget ? 3000038 : 3000037)) : 3000035) : 3000034

// One Actions-generated minute is shared by every candidate ABI and CI mode.
// Never read the clock during Gradle configuration or reconstruct a reused version.
def androidVersionPath = project.findProperty('androidVersionFile') ?: System.getenv('STUDIO_ANDROID_VERSION_FILE')
def androidCandidateVersion = null
if (androidVersionPath) {
    def versionFile = new File(androidVersionPath.toString())
    if (!versionFile.isAbsolute()) versionFile = new File(rootProject.projectDir.parentFile, androidVersionPath.toString())
    if (!versionFile.isFile()) throw new GradleException('Missing shared Android version metadata')
    androidCandidateVersion = new groovy.json.JsonSlurper().parse(versionFile)
    if (androidCandidateVersion.schema != 1 || androidCandidateVersion.versionCode != expectedCandidateVersionCode || androidCandidateVersion.timeZone != 'Asia/Shanghai'
            || !(androidCandidateVersion.versionName ==~ /\d{4}\.\d{2}\.\d{2}-\d{4}/) || !(androidCandidateVersion.sourceSHA ==~ /[a-f0-9]{40}/))
        throw new GradleException('Invalid Android candidate date version metadata')
    def formatter = java.time.format.DateTimeFormatter.ofPattern('uuuu.MM.dd-HHmm').withResolverStyle(java.time.format.ResolverStyle.STRICT)
    java.time.LocalDateTime.parse(androidCandidateVersion.versionName, formatter)
    if (project.hasProperty('betaVersionCode') && project.property('betaVersionCode').toInteger() != androidCandidateVersion.versionCode
            || project.hasProperty('betaVersionName') && project.property('betaVersionName') != androidCandidateVersion.versionName)
        throw new GradleException('Legacy beta properties differ from shared Android version metadata')
} else if (project.hasProperty('environmentClient')) {
    throw new GradleException('Environment candidates require -PandroidVersionFile or STUDIO_ANDROID_VERSION_FILE')
}

def signingFile = rootProject.file('keystore.properties')
def signing = new Properties()
if (!regularEnvironmentClient && signingFile.exists()) signingFile.withInputStream { signing.load(it) }

