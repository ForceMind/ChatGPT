    android.buildTypes[environmentBuildType].buildConfigField 'String', 'ENVIRONMENT_HOME_URL', environmentTest ? (project.hasProperty('environmentNetworkTest') ? '"https://network-fixture.test:18480/c/a1"' : '"https://environment-fixture.test:18480/c/environment"') : '""'
    if (regularEnvironmentCi) android.buildTypes.release.ndk { abiFilters.clear(); abiFilters 'x86_64' }
    dependencies.add(environmentBuildType + 'Implementation', 'org.mozilla.geckoview:geckoview:158.0.20261021001945')
    android.sourceSets[environmentBuildType].java.srcDir('src/environmentClient/java')
