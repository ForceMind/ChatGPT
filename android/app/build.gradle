    android.sourceSets.androidTest.manifest.srcFile(regularEnvironmentClient ? 'src/regularEnvironmentTest/AndroidManifest.xml' : 'src/betaUpgrade/AndroidManifest.xml')
    if (environmentTest || regularEnvironmentClient) {
        // Merge the CI-only activity into the generated environment manifest, never the human APK.
        def generatedManifest = layout.buildDirectory.file(regularEnvironmentClient ? 'generated/regular-environment/AndroidManifest.xml' : 'generated/environment-ci/AndroidManifest.xml')
        tasks.register('prepareEnvironmentCiManifest') {
            inputs.files('src/environmentClient/AndroidManifest.xml','src/environmentCi/AndroidManifest.xml')
            inputs.property('regularEnvironmentClient', regularEnvironmentClient)
            inputs.property('regularEnvironmentCi', regularEnvironmentCi)
            inputs.property('environmentTest', environmentTest)
            inputs.property('environmentNetworkTest', project.hasProperty('environmentNetworkTest'))
            inputs.property('regularLegacyNetworkTest', regularLegacyNetworkTest)
            inputs.property('regularWorkbenchTest', regularWorkbenchTest)
            inputs.property('appUpdateCandidate', appUpdateCandidate)
            inputs.property('appUpdateAuto', appUpdateAuto)
            inputs.property('appUpdateTest', appUpdateTest)
            outputs.file(generatedManifest)
            doLast {
                def base = file('src/environmentClient/AndroidManifest.xml').getText('UTF-8')
                if (regularEnvironmentClient) base = base.replace('android:label="ChatGPT Studio Beta"', 'android:label="ChatGPT Studio"')
                if (regularEnvironmentCi) base = base.replace('<application ', '<application android:testOnly="true" ')
                def inner = ''
                if (environmentTest) {
                    def extra = file('src/environmentCi/AndroidManifest.xml').getText('UTF-8')
                    inner = extra.substring(extra.indexOf('<application>') + '<application>'.length(), extra.indexOf('</application>'))
                }
                if (appUpdateCandidate) {
                    base = base.replace('<application ', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" /><application ')
                    inner += '<activity android:name=".AppUpdateActivity" android:exported="false" android:launchMode="singleTop" android:theme="@style/AppUpdateHostTheme" />'
                    inner += '<service android:name=".AppUpdateService" android:exported="false" android:foregroundServiceType="dataSync" android:stopWithTask="false" />'
                    inner += '<receiver android:name=".AppUpdateInstallReceiver" android:exported="false" />'
                }
                if (appUpdateAuto) inner += '<service android:name=".AppUpdateCheckJob" android:exported="true" android:permission="android.permission.BIND_JOB_SERVICE" />'
                if (appUpdateTest) base = base.replace('<application ', '<application android:networkSecurityConfig="@xml/app_update_test_security" ')
                if (regularWorkbenchTest) inner += '<activity android:name=".UploadProbeActivity" android:exported="false" />'
                if (project.hasProperty('environmentNetworkTest')) {
                    base=base.replace('<application ', '<application android:networkSecurityConfig="@xml/studio_environment_network_security" ')
                    base=base.replace('tools:replace="android:label"','tools:replace="android:label,android:networkSecurityConfig"')
                    inner += '<provider android:name=".EnvironmentNetworkFilesProvider" android:authorities="${applicationId}.network-docs" android:exported="true" android:permission="android.permission.MANAGE_DOCUMENTS" android:grantUriPermissions="true"><intent-filter><action android:name="android.content.action.DOCUMENTS_PROVIDER" /></intent-filter></provider>'
                    if (regularLegacyNetworkTest) {
                        inner += '<provider android:name=".NetworkDocumentsProvider" android:authorities="${applicationId}.legacy-network-docs" android:exported="true" android:permission="android.permission.MANAGE_DOCUMENTS" android:grantUriPermissions="true"><intent-filter><action android:name="android.content.action.DOCUMENTS_PROVIDER" /></intent-filter></provider>'
                        inner += '<receiver android:name=".NetworkProxyAdminReceiver" android:exported="true" android:permission="android.permission.BIND_DEVICE_ADMIN"><meta-data android:name="android.app.device_admin" android:resource="@xml/network_ci_admin" /><intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED" /></intent-filter></receiver>'
                        inner += '<activity android:name=".UploadProbeActivity" android:exported="false" />'
                    }
                }
                def target = generatedManifest.get().asFile; target.parentFile.mkdirs()
                target.setText(base.replace('</application>', inner + '</application>'),'UTF-8')
            }
        }
        android.sourceSets[environmentBuildType].manifest.srcFile(generatedManifest.get().asFile)
        tasks.matching { it.name == environmentPreBuild }.configureEach { dependsOn 'prepareEnvironmentCiManifest' }
