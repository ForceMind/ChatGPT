    android.buildTypes[environmentBuildType].buildConfigField 'boolean', 'NETWORK_TEST', 'true'
    android.buildTypes[environmentBuildType].buildConfigField 'String', 'NETWORK_HOME_URL', '"https://network-fixture.test:18480/c/a1"'
    android.buildTypes[environmentBuildType].buildConfigField 'String', 'NETWORK_PROBE_URL', '"https://network-fixture.test:18480/echo"'
    if (regularLegacyNetworkTest) android.buildTypes[environmentBuildType].buildConfigField 'String', 'NETWORK_HOME_URL', '"https://network-fixture.test:18480/joint/studio-home/page"'
    def ownedCa = rootProject.file('network-poc/secure-fixture/ca.pem')
    def trustRoot = layout.buildDirectory.dir('generated/environment-network-ci').get().asFile
    tasks.register('prepareEnvironmentNetworkTrust') {
        inputs.file ownedCa
        inputs.property('regularLegacyNetworkTest', regularLegacyNetworkTest)
        outputs.dir trustRoot
        doLast {
            def pem=ownedCa.getText('UTF-8')
            if (!pem.startsWith('-----BEGIN CERTIFICATE-----')) throw new GradleException('Missing owned Gecko network CA')
            def javaFile=new File(trustRoot,'java/com/forcemind/chatgpt/profiles/GeneratedNetworkTrust.java')
            javaFile.parentFile.mkdirs()
            javaFile.text='package com.forcemind.chatgpt.profiles; public final class GeneratedNetworkTrust { public static final String PEM = ' + groovy.json.JsonOutput.toJson(pem) + '; }'
            def ca=new File(trustRoot,'res/raw/studio_environment_network_ci_ca.pem');ca.parentFile.mkdirs();ca.text=pem
            def config=new File(trustRoot,'res/xml/studio_environment_network_security.xml');config.parentFile.mkdirs()
            config.text='<network-security-config><base-config cleartextTrafficPermitted="false" /><domain-config><domain includeSubdomains="false">network-fixture.test</domain><domain includeSubdomains="false">files.network-fixture.test</domain><trust-anchors><certificates src="system" /><certificates src="@raw/studio_environment_network_ci_ca" /></trust-anchors></domain-config></network-security-config>'
            if (regularLegacyNetworkTest) {
                // Same owned control-plane allowance as the existing networkCi
                // fixture. Guest OUTPUT rules restrict the host port to 18080.
                config.text=config.text.replace('</network-security-config>', '<domain-config cleartextTrafficPermitted="true"><domain includeSubdomains="false">10.0.2.2</domain><domain includeSubdomains="false">127.0.0.1</domain></domain-config></network-security-config>')
            }
        }
    }
    android.sourceSets[environmentBuildType].java.srcDir(new File(trustRoot,'java'))
    android.sourceSets[environmentBuildType].res.srcDir(new File(trustRoot,'res'))
    tasks.matching { it.name == environmentPreBuild }.configureEach { dependsOn 'prepareEnvironmentNetworkTrust' }
}

// The retained WebView path uses its existing network/file assertions against
// the same original-package CI APK. Providers remain owned, test-only sources.
if (regularLegacyNetworkTest || regularWorkbenchTest) {
    def legacyTests = layout.buildDirectory.dir('generated/regular-legacy-network-tests')
    def legacyProviders = layout.buildDirectory.dir('generated/regular-legacy-network-providers')
    def legacyResources = layout.buildDirectory.dir('generated/regular-legacy-network-res')
    tasks.register('copyRegularLegacyNetworkTests', Sync) {
        inputs.file('src/androidTest/java/com/forcemind/chatgpt/profiles/NetworkBenchmarkTest.java')
        from 'src/androidTest/java'
        include '**/NetworkIntegrationTest.java', '**/NetworkFileSafetyTest.java', '**/NetworkSystemProxy.java', '**/WorkbenchTest.java', '**/FixtureFilesProvider.java'
        into legacyTests
        filteringCharset = 'UTF-8'
        filter { line -> line
            .replace('BuildConfig.APPLICATION_ID.endsWith(".networkci")', '(BuildConfig.APPLICATION_ID.equals("com.forcemind.chatgpt.profiles") && BuildConfig.ENVIRONMENT_NETWORK_TEST)')
            .replace('BuildConfig.APPLICATION_ID+".network-docs"', 'BuildConfig.APPLICATION_ID+".legacy-network-docs"')
            .replace('context.getPackageName().endsWith(".debug")', '(context.getPackageName().equals("com.forcemind.chatgpt.profiles") && BuildConfig.ENVIRONMENT_TEST)')
        }
        doLast {
            def benchmark = file('src/androidTest/java/com/forcemind/chatgpt/profiles/NetworkBenchmarkTest.java').getText('UTF-8')
            def helperStart = benchmark.indexOf('    static boolean goMapped(Context context)throws Exception{')
            def helperEnd = benchmark.indexOf('    private void configure(', helperStart)
            if (helperStart < 0 || helperEnd <= helperStart) throw new GradleException('Go mapping helper boundary changed; review required')
            def helper = new File(legacyTests.get().asFile, 'com/forcemind/chatgpt/profiles/NetworkBenchmarkTest.java')
            helper.setText('package com.forcemind.chatgpt.profiles;\nimport android.content.Context;\nimport java.io.File;\nimport java.nio.file.Files;\nimport java.nio.charset.StandardCharsets;\nimport static org.junit.Assert.*;\nfinal class NetworkBenchmarkTest {\n' + benchmark.substring(helperStart, helperEnd) + '}\n', 'UTF-8')
            def workbench = new File(legacyTests.get().asFile, 'com/forcemind/chatgpt/profiles/WorkbenchTest.java')
            def body = workbench.getText('UTF-8')
            def start = body.indexOf('    private void screenshot(String name)throws Exception{')
            def end = body.indexOf('    private String htmlBody(', start)
            if (start < 0 || end <= start) throw new GradleException('Workbench screenshot boundary changed; review required')
            // The user forbids screenshots. Omit only this visual-artifact helper;
            // file bytes, preview/content, conversions and task assertions stay intact.
            body = body.substring(0, start) + '    private void screenshot(String name)throws Exception{ System.out.println("VISUAL_ARTIFACT_DISABLED_BY_APPROVED_SCOPE "+name); }\n' + body.substring(end)
            body = body.replace('Assume.assumeTrue("Only explicit isolated fixture runs modify account fixtures",', 'assertTrue("Only explicit isolated fixture runs modify account fixtures",')
            body = body.replace('Assume.assumeTrue(android.os.Build.VERSION.SDK_INT>=29);', 'assertTrue(android.os.Build.VERSION.SDK_INT==28||android.os.Build.VERSION.SDK_INT==35);')
            if (!body.contains('return input.read()==-1;')) throw new GradleException('Renderer process observation changed; review required')
            // Drain shell output to EOF before closing the UiAutomation pipe;
            // Android 9 otherwise throws EPIPE in its repeater thread.
            body = body.replace('return input.read()==-1;', 'java.io.ByteArrayOutputStream observed=new java.io.ByteArrayOutputStream();byte[] bytes=new byte[1024];int n;while((n=input.read(bytes))!=-1)observed.write(bytes,0,n);return observed.size()==0;')
            if (body.contains('takeScreenshot(')) throw new GradleException('Screenshot call in regular workbench tests')
            workbench.setText(body, 'UTF-8')
        }
    }
    tasks.register('copyRegularLegacyNetworkProviders', Sync) {
        from 'src/networkCi/java'
        from 'src/debug/java'
        include '**/NetworkDocumentsProvider.java', '**/NetworkProxyAdminReceiver.java', '**/UploadProbeActivity.java', '**/EnvironmentProbeActivity.java'
        into legacyProviders
        filteringCharset = 'UTF-8'
        filter { line -> line.replace('getContext().getPackageName().endsWith(".networkci")', '(BuildConfig.NETWORK_TEST && BuildConfig.ENVIRONMENT_TEST && getContext().getPackageName().equals("com.forcemind.chatgpt.profiles"))') }
    }
    tasks.register('copyRegularLegacyNetworkResources', Sync) {
        from 'src/networkCi/res'
        include 'xml/network_ci_admin.xml'
        into legacyResources
    }
    android.sourceSets.androidTest.java.srcDir(legacyTests.get().asFile)
    android.sourceSets.androidTest.manifest.srcFile('src/androidTest/AndroidManifest.xml')
    android.sourceSets.release.java.srcDir(legacyProviders.get().asFile)
    android.sourceSets.release.res.srcDir(legacyResources.get().asFile)
    tasks.matching { it.name == 'preReleaseAndroidTestBuild' }.configureEach { dependsOn 'copyRegularLegacyNetworkTests' }
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'copyRegularLegacyNetworkProviders', 'copyRegularLegacyNetworkResources' }
}

// This test APK is later signed locally with the original certificate. It has
// no general fixture provider or UI tests, and its first action verifies QEMU,
// certificate, exact installed bytes and the non-debug/non-testOnly release.
if (originalSignatureTest) {
    def originalTests = layout.buildDirectory.dir('generated/original-signature-tests')
    android.sourceSets.androidTest.java.setSrcDirs(['src/originalSignatureTest/java', originalTests.get().asFile])
    android.sourceSets.androidTest.manifest.srcFile('src/originalSignatureTest/AndroidManifest.xml')
    tasks.register('requireOriginalSignatureSources') {
        doLast {
            if (!new File(originalTests.get().asFile, 'com/forcemind/chatgpt/profiles/OriginalSignatureUpgradeData.java').isFile())
                throw new GradleException('Run prepare-original-signature-tests.py in Actions first')
        }
    }
    tasks.matching { it.name == 'preReleaseAndroidTestBuild' }.configureEach { dependsOn 'requireOriginalSignatureSources' }
}
