                def manifest = new File(environmentAssets.get().asFile,'studio-environment/manifest.json')
                def value = new groovy.json.JsonSlurper().parse(manifest)
                value.content_scripts[0].matches += [project.hasProperty('environmentNetworkTest') ? 'https://network-fixture.test/*' : 'https://environment-fixture.test/*']
