                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'app-update-r8.pro'
            }
            ndk { abiFilters(regularEnvironmentClient && !regularEnvironmentCi ? regularReviewAbi : 'arm64-v8a') }
        }
        networkBeta {
            initWith release
            applicationIdSuffix '.networkbeta'
            versionNameSuffix(androidCandidateVersion != null ? '' : '-beta.1')
            signingConfig !regularEnvironmentClient && System.getenv('STUDIO_BETA_KEYSTORE_PATH') ? signingConfigs.networkBetaKey : null
            debuggable false
            matchingFallbacks = ['release']
            ndk { abiFilters.clear(); abiFilters(project.findProperty('betaAbi') ?: 'arm64-v8a') }
        }
        networkPreview {
            initWith release
            applicationIdSuffix '.networkpreview'
            versionNameSuffix '-standalone'
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
            ndk { abiFilters 'arm64-v8a' }
        }
    }
        // Isolated, synthetic acceptance only; never installed over the public app.
        buildTypes { networkCi {
            initWith buildTypes.debug
            applicationIdSuffix '.networkci'
            versionNameSuffix '-network-ci'
            matchingFallbacks = ['debug']
            ndk { abiFilters 'x86_64' }
            buildConfigField 'boolean', 'NETWORK_TEST', 'true'
            buildConfigField 'String', 'NETWORK_HOME_URL', '"https://network-fixture.test:18480/joint/studio-home/page"'
            buildConfigField 'String', 'NETWORK_PROBE_URL', '"https://network-fixture.test:18480/echo"'
        }
        }
        testBuildType = regularEnvironmentClient ? 'release' : (project.hasProperty('betaUpgrade') || project.hasProperty('betaBrowserUpgrade') || project.hasProperty('betaNetworkUi') || project.hasProperty('environmentClient')) ? 'networkBeta' : project.hasProperty('networkIntegration') ? 'networkCi' : 'debug'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
}
