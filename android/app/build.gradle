        buildConfigField 'boolean', 'ENVIRONMENT_CLIENT', 'false'
        buildConfigField 'boolean', 'ENVIRONMENT_TEST', 'false'
        buildConfigField 'boolean', 'APP_UPDATES_ENABLED', 'false'
        buildConfigField 'boolean', 'APP_UPDATE_AUTO', 'false'
        buildConfigField 'boolean', 'APP_UPDATE_ACCEPTANCE', appUpdateAcceptance.toString()
        buildConfigField 'boolean', 'APP_UPDATE_TEST', 'false'
        buildConfigField 'String', 'APP_UPDATE_TEST_ORIGIN', '""'
        buildConfigField 'boolean', 'ENVIRONMENT_NETWORK_TEST', 'false'
