<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native lifecycle fixture</title>
<style>body{font:16px sans-serif;background:white;color:#171717;margin:16px}textarea{box-sizing:border-box;width:100%;height:90px;border:1px solid #aaa}#reading{height:40vh;overflow:auto}img{max-width:100%;height:auto}p{line-height:1.7}</style>
<h1>原生保活验收</h1><p>本地合成页面，不调用 ChatGPT 服务。</p><textarea id="prompt-textarea"></textarea><button id="send" type="button">测试发送计数</button><div id="reading"></div><canvas width="640" height="360" hidden></canvas>
<script>
(function(config){
 'use strict';var instance=crypto.randomUUID(),beats=0,events=0,sent=0;var input=document.querySelector('textarea');input.value=config.draft;document.querySelector('#send').onclick=function(){sent++;};
 var canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.fillStyle='#f0f0f0';ctx.fillRect(0,0,640,360);ctx.fillStyle='#171717';ctx.font='24px sans-serif';ctx.fillText('Local image workload',30,70);var picture=canvas.toDataURL('image/png'),reading=document.querySelector('#reading');for(var i=0;i<80;i++){var p=document.createElement('p');p.textContent='Offline conversation fixture '+i+' — retain the same document, draft and background activity.';reading.appendChild(p);if(i%15===0){var image=document.createElement('img');image.src=picture;reading.appendChild(image);}}
 function beacon(){crypto.subtle.digest('SHA-256',new TextEncoder().encode(input.value)).then(function(hash){var hex=Array.from(new Uint8Array(hash)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');return fetch('/lifecycle-beacon?tab='+config.tab+'&instance='+instance+'&beats='+beats+'&events='+events+'&sent='+sent+'&images='+Array.from(document.images).filter(function(i){return i.complete&&i.naturalWidth>0;}).length+'&draftHash='+hex,{cache:'no-store'});}).catch(function(){});}
 if(config.streaming){var source=new EventSource('/lifecycle-events?tab='+config.tab);source.onmessage=function(){events++;if(events%3===0)beacon();};}else{setInterval(function(){fetch('/lifecycle-poll?tab='+config.tab).then(function(r){return r.text();}).then(function(){events++;if(events%3===0)beacon();}).catch(function(){});},1000);}setInterval(function(){beats++;if(beats%3===0)beacon();},1000);setTimeout(beacon,500);
 window.fixtureLifecycle={instance:instance,owner:config.owner,phase:config.phase};
})(__CONFIG__);
</script>
