<section class="aw-workbench" id="wb-workbench" aria-label="资产中心">
          <aside class="aw-sidebar">
            <div class="aw-sidebar-heading">
              <div class="aw-workspace-mark" data-icon="folder"></div>
              <div>
                <h1>资产中心</h1>
                <p id="wb-sidebar-account">工作账号的本机文件</p>
              </div>
            </div>
            <nav id="wb-asset-navigation" aria-label="资产分类"></nav>
            <div class="aw-sidebar-divider"></div>
            <button class="aw-sidebar-action" data-action="skills">
              <span class="aw-inline-icon" data-icon="sparkles"></span>Skill
              库<span>120</span></button
            ><button class="aw-sidebar-action" data-action="agents">
              <span class="aw-inline-icon" data-icon="agents"></span>智能体库<span
                >0</span
              >
            </button>
            <div class="aw-sidebar-bottom">
              <span class="aw-inline-icon" data-icon="shield"></span>
              <div>文件按账号归属整理<small>资产与原件保存在本机</small></div>
            </div>
          </aside>
          <div class="aw-asset-main">
            <div class="aw-page-heading">
              <div>
                <p class="aw-breadcrumb">工作空间 <span>/</span> 资产</p>
                <h2 id="wb-asset-title">
                  全部资产 <span id="wb-asset-count"></span>
                </h2>
              </div>
              <div class="aw-heading-actions">
                <button class="aw-secondary" data-action="import">
                  <span class="aw-inline-icon" data-icon="plus"></span
                  >导入文件</button
                ><button
                  class="aw-icon-button aw-close-panel"
                  data-action="chat"
                  aria-label="关闭资产中心，返回网页"
                >
                  <span class="aw-inline-icon" data-icon="close"></span>
                </button>
              </div>
            </div>
            <div class="aw-asset-toolbar">
              <label class="aw-search-box"
                ><span class="aw-inline-icon" data-icon="search"></span
                ><input
                  id="wb-asset-search"
                  type="search"
                  placeholder="搜索文件名、标签或来源对话"
                  aria-label="搜索资产"
                /><kbd>⌘ K</kbd></label
              >
              <div class="aw-toolbar-controls">
                <select id="wb-asset-sort" aria-label="资产排序">
                  <option value="recent">最近添加</option>
                  <option value="name">按名称</option>
                  <option value="size">按大小</option>
                </select>
                <div class="aw-view-switch" role="group" aria-label="文件视图">
                  <button data-view="grid" class="aw-active" aria-label="网格视图">
                    <span class="aw-inline-icon" data-icon="grid"></span></button
                  ><button data-view="list" aria-label="列表视图">
                    <span class="aw-inline-icon" data-icon="list"></span>
                  </button>
                </div>
              </div>
            </div>
            <div class="aw-asset-context" id="wb-asset-context"></div>
            <div class="aw-selection-bar" id="wb-selection-bar" hidden></div>
            <div class="aw-asset-scroll">
              <div id="wb-asset-grid" class="aw-asset-grid"></div>
            </div>
            <div class="aw-asset-status" id="wb-asset-status"></div>
          </div>
          <aside
            class="aw-asset-detail"
            id="wb-asset-detail"
            aria-label="资产详情"
          ></aside>
        </section>
<section
          class="aw-capability-page"
          id="wb-capability-page"
          hidden
          aria-label="能力库"
        >
          <aside class="aw-sidebar aw-library-sidebar">
            <div class="aw-sidebar-heading">
              <div class="aw-workspace-mark" data-icon="sparkles"></div>
              <div>
                <h1>能力库</h1>
                <p>给任务选合适的方法</p>
              </div>
            </div>
            <div class="aw-library-tabs">
              <button data-action="skills" id="wb-skills-nav">
                <span class="aw-inline-icon" data-icon="sparkles"></span>Skill<span
                  >120</span
                ></button
              ><button data-action="agents" id="wb-agents-nav">
                <span class="aw-inline-icon" data-icon="agents"></span>智能体<span
                  >0</span
                >
              </button>
            </div>
            <div class="aw-sidebar-divider"></div>
            <nav id="wb-capability-navigation" aria-label="能力分类"></nav>
            <button class="aw-sidebar-action aw-back-assets" data-action="assets">
              <span class="aw-inline-icon" data-icon="folder"></span>回到资产中心
            </button>
            <div class="aw-sidebar-bottom">
              <span class="aw-inline-icon" data-icon="book"></span>
              <div>角色与任务分别选择<small>完整资源随 App 保存</small></div>
            </div>
          </aside>
          <div class="aw-capability-main">
            <div class="aw-page-heading">
              <div>
                <p class="aw-breadcrumb">工作空间 <span>/</span> 能力库</p>
                <h2 id="wb-capability-title">Skill <span>120</span></h2>
                <p class="aw-page-description" id="wb-capability-description"></p>
              </div>
              <button
                class="aw-icon-button aw-close-panel"
                data-action="chat"
                aria-label="关闭能力库，返回网页"
              >
                <span class="aw-inline-icon" data-icon="close"></span>
              </button>
            </div>
            <div class="aw-library-toolbar">
              <label class="aw-search-box"
                ><span class="aw-inline-icon" data-icon="search"></span
                ><input
                  id="wb-capability-search"
                  type="search"
                  placeholder="搜索能力、用途或关键词"
                  aria-label="搜索能力库" /></label
              ><button
                class="aw-secondary"
                id="wb-favorites-only"
                aria-pressed="false"
              >
                <span class="aw-inline-icon" data-icon="star"></span>收藏
              </button>
            </div>
            <div class="aw-library-notice" id="wb-library-notice"></div>
            <div class="aw-capability-scroll">
              <div
                class="aw-library-result-heading"
                id="wb-library-result-heading"
              ></div>
              <div id="wb-capability-grid" class="aw-capability-grid"></div>
            </div>
          </div>
          <aside
            class="aw-capability-detail"
            id="wb-capability-detail"
            aria-label="能力详情"
          ></aside>
        </section>
<button type="button" class="aw-detail-backdrop" data-action="close-details" aria-label="关闭详情抽屉" tabindex="-1"></button>
<div id="wb-modal-root"></div>
