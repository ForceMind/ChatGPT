---
name: Android regular optimization resource comparison
'on':
  push:
    branches:
    - dev
    paths:
    - ".github/workflows/android-optimization-resources.yml"
  workflow_dispatch:
    inputs:
      baseline_run:
        type: string
        required: true
        description: Successful baseline functional run
      r8_run:
        type: string
        required: true
        description: Successful r8 functional run
      resources_run:
        type: string
        required: true
        description: Successful resources functional run
permissions:
  contents: read
  actions: read
env:
  STUDIO_ANDROID_CI_TARGET: regular
  STUDIO_REGULAR_VALIDATION_SCRIPT: android/scripts/measure-regular-optimization.py
jobs:
  resources:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api:
        - 28
        - 35
        pages:
        - 1
        - 4
        load:
        - idle
        - stream
    steps:
    - uses: actions/checkout@v4
    - name: Bind the exact approved resource entry in disposable bootstraps
      run: python3 android/scripts/prepare-regular-resource-driver.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Prepare the existing fixture tools
      run: |
        sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libnss3-tools
    - uses: actions/download-artifact@v4
      with:
        name: regular-environment-ci-input
        run-id: "${{ inputs.baseline_run }}"
        github-token: "${{ github.token }}"
        path: android/app/build/resource-cohort/baseline/input
    - uses: actions/download-artifact@v4
      with:
        name: optimization-build-diagnostics
        run-id: "${{ inputs.baseline_run }}"
        github-token: "${{ github.token }}"
        path: android/app/build/resource-cohort/baseline/diagnostics
    - uses: actions/download-artifact@v4
      with:
        name: regular-environment-ci-input
        run-id: "${{ inputs.r8_run }}"
        github-token: "${{ github.token }}"
        path: android/app/build/resource-cohort/r8/input
    - uses: actions/download-artifact@v4
      with:
        name: optimization-build-diagnostics
        run-id: "${{ inputs.r8_run }}"
        github-token: "${{ github.token }}"
        path: android/app/build/resource-cohort/r8/diagnostics
    - uses: actions/download-artifact@v4
      with:
        name: regular-environment-ci-input
        run-id: "${{ inputs.resources_run }}"
        github-token: "${{ github.token }}"
        path: android/app/build/resource-cohort/resources/input
    - uses: actions/download-artifact@v4
      with:
        name: optimization-build-diagnostics
        run-id: "${{ inputs.resources_run }}"
        github-token: "${{ github.token }}"
        path: android/app/build/resource-cohort/resources/diagnostics
    - uses: actions/download-artifact@v4
      if: matrix.api == 28
      with:
        name: beta-continuation-input
        run-id: 41993581770
        github-token: "${{ github.token }}"
        path: android/app/build/environment-provider-input
    - name: Compile the existing native ASCII helper outside the APK
      run: |
        mkdir -p android/app/build/environment-ascii/classes
        javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-ascii/classes android/scripts/android/AsciiInput.java android/scripts/android/AsciiInputStream.java
        "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-ascii/input.jar android/app/build/environment-ascii/classes/com/forcemind/chatgpt/pocinput/*.class
    - name: Compile the existing Android9 touch helper outside the APK
      if: matrix.api == 28
      run: |
        mkdir -p android/app/build/environment-touch/classes
        javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
        "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
    - name: Enable the existing owned emulator acceleration
      run: |
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
    - name: Measure baseline on the same scenario host with a fresh emulator
      env:
        GH_TOKEN: "${{ github.token }}"
        STUDIO_RESOURCE_SOURCE_RUN: "${{ inputs.baseline_run }}"
        STUDIO_RESOURCE_MODE: baseline
        STUDIO_RESOURCE_PAGES: "${{ matrix.pages }}"
        STUDIO_RESOURCE_LOAD: "${{ matrix.load }}"
      run: python3 android/scripts/run-regular-resource-cohort-mode.py --api ${{ matrix.api
        }}
    - name: Measure r8 on the same scenario host with a fresh emulator
      env:
        GH_TOKEN: "${{ github.token }}"
        STUDIO_RESOURCE_SOURCE_RUN: "${{ inputs.r8_run }}"
        STUDIO_RESOURCE_MODE: r8
        STUDIO_RESOURCE_PAGES: "${{ matrix.pages }}"
        STUDIO_RESOURCE_LOAD: "${{ matrix.load }}"
      run: python3 android/scripts/run-regular-resource-cohort-mode.py --api ${{ matrix.api
        }}
    - name: Measure resources on the same scenario host with a fresh emulator
      env:
        GH_TOKEN: "${{ github.token }}"
        STUDIO_RESOURCE_SOURCE_RUN: "${{ inputs.resources_run }}"
        STUDIO_RESOURCE_MODE: resources
        STUDIO_RESOURCE_PAGES: "${{ matrix.pages }}"
        STUDIO_RESOURCE_LOAD: "${{ matrix.load }}"
      run: python3 android/scripts/run-regular-resource-cohort-mode.py --api ${{ matrix.api
        }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: regular-optimization-resources-${{ matrix.api }}-${{ matrix.pages }}-${{
          matrix.load }}
        retention-days: 14
        if-no-files-found: error
        path: android/app/build/regular-resource-evidence/
