name: Android Recovery PoC
on:
  workflow_dispatch:
    inputs:
      apis:
        description: Fresh CI emulator APIs, 28 and 35 only
        type: string
        default: '[28,35]'
      managed:
        type: boolean
        default: true
      core_only:
        type: boolean
        default: false
      input_diagnostic:
        type: boolean
        default: false
      runtime:
        description: Independent APK variant; release uses a disposable CI certificate
        type: choice
        options: [optimized-release, debug]
        default: optimized-release
      build_only:
        description: Build only; disable only after explicit browser-interaction authorization
        type: boolean
        default: true
      experiment:
        description: Authorized independent measurement; no screenshots or live ChatGPT
        type: choice
        options: [recovery, input-warning, long-background, doze-probe]
        default: recovery
  workflow_call:
    inputs:
      apis:
        type: string
        required: false
        default: '[28,35]'
      managed:
        type: boolean
        required: false
        default: false
      core_only:
        type: boolean
        required: false
        default: false
      input_diagnostic:
        type: boolean
        required: false
        default: false
      runtime:
        type: string
        required: false
        default: debug
      build_only:
        type: boolean
        required: false
        default: false
      experiment:
        type: string
        required: false
        default: recovery
permissions:
  contents: read
jobs:
  package-size:
    if: inputs.managed && !inputs.core_only && !inputs.input_diagnostic && inputs.runtime != 'optimized-release' && (inputs.experiment == 'recovery' || inputs.experiment == '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Measure fixed-engine unsigned release modes
        working-directory: android
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          python3 -m unittest discover -s scripts/tests -p 'test_package_size_poc.py' -v
          python3 -m py_compile scripts/package-size-poc.py
          python3 -u scripts/package-size-poc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-isolated-release-size
          retention-days: 14
          path: |
            android/environment-poc/build/package-size-evidence/
            android/environment-poc/build/reports/lint-results-release.*
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.experiment == 'long-background' && 65 || inputs.experiment == 'doze-probe' && 45 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
    env:
      RECOVERY_API: ${{ matrix.api }}
      POC_MIN_API: ${{ matrix.api == 28 && 28 || 29 }}
      POC_RUNTIME_VARIANT: ${{ inputs.runtime || 'debug' }}
      POC_BUILD_ONLY: ${{ inputs.build_only }}
      POC_MANAGED: ${{ inputs.managed }}
      POC_CORE: ${{ inputs.core_only }}
      POC_INPUT_DIAGNOSTIC: ${{ inputs.input_diagnostic }}
      POC_EXPERIMENT: ${{ inputs.experiment || 'recovery' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare isolated compatibility measurement
        working-directory: android
        run: |
          python3 -c 'import os; assert int(os.environ["RECOVERY_API"]) in (28,35)'
          python3 - <<'PY'
          import os
          mode=os.environ['POC_RUNTIME_VARIANT'];assert mode in ('debug','optimized-release')
          if mode=='optimized-release':assert os.environ['POC_MANAGED']=='true' and os.environ['POC_CORE']!='true' and os.environ['POC_INPUT_DIAGNOSTIC']!='true'
          experiment=os.environ['POC_EXPERIMENT'];assert experiment in ('recovery','input-warning','long-background','doze-probe')
          if experiment!='recovery':assert mode=='optimized-release' and os.environ['POC_MANAGED']=='true' and os.environ['POC_CORE']!='true' and os.environ['POC_INPUT_DIAGNOSTIC']!='true'
          PY
          mkdir -p environment-poc/build/recovery-evidence
          python3 -c 'import ast; ast.parse(open("scripts/recovery-environment-poc.py").read())'
          python3 -c 'import ast; ast.parse(open("scripts/managed-recovery-poc.py").read())'
          python3 -m unittest discover -s scripts/tests -p 'test_poc_warning_report.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_poc_extended_measurements.py' -v
          if [ "$POC_RUNTIME_VARIANT" = optimized-release ]; then
            python3 -m unittest discover -s scripts/tests -p 'test_ci_release_adb.py' -v
            python3 -m unittest discover -s scripts/tests -p 'test_sign_poc_release.py' -v
          fi
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ "$POC_EXPERIMENT" = input-warning ]; then python3 scripts/poc_extended_measurements.py --collect-source environment-poc/build/recovery-evidence; fi
          if [ "$POC_BUILD_ONLY" != true ]; then sdkmanager emulator "system-images;android-${RECOVERY_API};google_apis;x86_64"; fi
      - name: Build without overriding library minimum requirements
        id: build
        working-directory: android
        run: |
          set -o pipefail
          if [ "$POC_RUNTIME_VARIANT" = optimized-release ]; then
            ./environment-poc/gradlew -p environment-poc --no-daemon -PpocMinSdk="$POC_MIN_API" -PpocAbis=x86_64 -PpocOptimization=resources assembleRelease lintRelease 2>&1 | tee environment-poc/build/recovery-evidence/build.txt
            python3 -u scripts/sign-poc-release.py
          else
            ./environment-poc/gradlew -p environment-poc --no-daemon -PpocMinSdk="$POC_MIN_API" assembleDebug lintDebug 2>&1 | tee environment-poc/build/recovery-evidence/build.txt
          fi
      - name: Record fixed library and APK compatibility metadata
        if: always()
        working-directory: android
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile,xml.etree.ElementTree as ET
          version='158.0.20261021001945'
          result={'sourceSha':os.environ['GITHUB_SHA'],'requestedMinSdk':int(os.environ['POC_MIN_API']),'testApi':int(os.environ['RECOVERY_API']),'buildOutcome':os.environ['BUILD_OUTCOME'],'version':version,'libraries':[]}
          result['runtimeVariant']=os.environ['POC_RUNTIME_VARIANT']
          cache=Path.home()/'.gradle/caches/modules-2/files-2.1/org.mozilla.geckoview/geckoview'/version
          for aar in cache.glob('**/*.aar'):
              with zipfile.ZipFile(aar) as archive:
                  manifest=ET.fromstring(archive.read('AndroidManifest.xml'));uses=manifest.find('uses-sdk')
                  result['libraries'].append({'file':aar.name,'bytes':aar.stat().st_size,'sha256':hashlib.sha256(aar.read_bytes()).hexdigest(),'minSdk':None if uses is None else uses.get('{http://schemas.android.com/apk/res/android}minSdkVersion')})
          apk=Path('environment-poc/build/runtime-release/environment-poc-x86_64-ci-release.apk' if os.environ['POC_RUNTIME_VARIANT']=='optimized-release' else 'environment-poc/build/outputs/apk/debug/environment-poc-x86_64-debug.apk')
          if apk.exists():
              badging=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/36.0.0/aapt2','dump','badging',str(apk)],text=True)
              Path('environment-poc/build/recovery-evidence/apk-badging.txt').write_text(badging)
              result['apk']={'bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          Path('environment-poc/build/recovery-evidence/compatibility.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Measure native session recovery on fresh emulator
        if: success() && !inputs.build_only
        working-directory: android
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/studio-recovery-${RECOVERY_API}"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          adb kill-server || true
          adb start-server
          avdmanager create avd --force --name recovery-poc --device pixel_6 --package "system-images;android-${RECOVERY_API};google_apis;x86_64"
          # A real hardware-keyboard configuration keeps software-IME gesture
          # typing from intercepting the page-scroll acceptance gesture.
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path(os.environ['ANDROID_AVD_HOME'])/'recovery-poc.avd/config.ini'
          text=p.read_text();text=re.sub(r'^hw\.keyboard\s*=.*$', 'hw.keyboard=yes', text, flags=re.M)
          if not re.search(r'^hw\.keyboard=yes$',text,re.M):text+='\nhw.keyboard=yes\n'
          p.write_text(text);assert re.search(r'^hw\.keyboard=yes$',p.read_text(),re.M)
          PY
          "$ANDROID_HOME/emulator/emulator" -avd recovery-poc -memory 4096 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan > environment-poc/build/recovery-evidence/emulator.log 2>&1 &
          trap '"$ANDROID_HOME/platform-tools/adb" emu kill || true' EXIT
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          python3 - <<'PY'
          import os,subprocess
          devices=[line.split()[0] for line in subprocess.check_output(['adb','devices'],text=True).splitlines()[1:] if line.endswith('\tdevice')]
          assert os.environ.get('GITHUB_ACTIONS')=='true' and len(devices)==1 and devices[0].startswith('emulator-')
          assert subprocess.check_output(['adb','shell','getprop','ro.kernel.qemu'],text=True).strip()=='1'
          PY
          adb shell input keyevent 82
          adb shell settings put secure show_ime_with_hard_keyboard 0
          # The full managed suite exercises the real Home/foreground path.
          if [ "$RECOVERY_API" = 28 ] || [ "${{ inputs.managed && !inputs.core_only && !inputs.input_diagnostic }}" = true ]; then
            adb shell am force-stop com.google.android.apps.nexuslauncher
          else
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
          fi
          if [ "$POC_RUNTIME_VARIANT" = optimized-release ]; then
            adb install environment-poc/build/runtime-release/environment-poc-x86_64-ci-release.apk
          else
            adb install environment-poc/build/outputs/apk/debug/environment-poc-x86_64-debug.apk
          fi
          if [ "$RECOVERY_API" = 28 ] && [ "${{ inputs.managed && !inputs.core_only && !inputs.input_diagnostic }}" = true ]; then
            mkdir -p environment-poc/build/input-helper/classes
            javac --release 8 -classpath "$ANDROID_HOME/platforms/android-37.0/android.jar" -d environment-poc/build/input-helper/classes scripts/android/TouchInput.java
            "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-37.0/android.jar" --output environment-poc/build/input-helper/input.jar environment-poc/build/input-helper/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
            adb push environment-poc/build/input-helper/input.jar /data/local/tmp/studio-poc-input.jar
          fi
          if [ "$RECOVERY_API" = 28 ] && { [ "$POC_EXPERIMENT" = long-background ] || [ "$POC_EXPERIMENT" = doze-probe ]; }; then
            mkdir -p environment-poc/build/metrics-helper/classes
            javac --release 8 -classpath "$ANDROID_HOME/platforms/android-37.0/android.jar" -d environment-poc/build/metrics-helper/classes scripts/android/ProcessMetrics.java
            "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-37.0/android.jar" --output environment-poc/build/metrics-helper/metrics.jar environment-poc/build/metrics-helper/classes/com/forcemind/chatgpt/pocmetrics/ProcessMetrics.class
            adb push environment-poc/build/metrics-helper/metrics.jar /data/local/tmp/studio-poc-metrics.jar
          fi
          if [ "$POC_RUNTIME_VARIANT" = optimized-release ]; then
            export POC_REAL_ADB="$ANDROID_HOME/platform-tools/adb"
            export POC_RELEASE_ATTESTATION="$RUNNER_TEMP/studio-release-${RECOVERY_API}.json"
            export POC_RELEASE_AUDIT="$GITHUB_WORKSPACE/android/environment-poc/build/recovery-evidence/release-fixture-access.jsonl"
            "$POC_REAL_ADB" root
            "$POC_REAL_ADB" wait-for-device
            python3 -u scripts/ci_release_adb.py --attest
            chmod +x scripts/release-adb/adb
            export PATH="$PWD/scripts/release-adb:$PATH"
          fi
          if [ "${{ inputs.managed }}" = true ]; then
            if [ "$POC_EXPERIMENT" = input-warning ]; then
              timeout 900 python3 -u scripts/managed-recovery-poc.py environment-poc/build/recovery-evidence --warning-probe
            elif [ "$POC_EXPERIMENT" = doze-probe ]; then
              timeout 1800 python3 -u scripts/managed-recovery-poc.py environment-poc/build/recovery-evidence --trace-input --long-background --doze-only
            elif [ "$POC_EXPERIMENT" = long-background ]; then
              timeout 3300 python3 -u scripts/managed-recovery-poc.py environment-poc/build/recovery-evidence --trace-input --long-background
            elif [ "${{ inputs.input_diagnostic }}" = true ]; then
              timeout 420 python3 -u scripts/managed-recovery-poc.py environment-poc/build/recovery-evidence --input-diagnostic
            elif [ "${{ inputs.core_only }}" = true ]; then
              timeout 900 python3 -u scripts/managed-recovery-poc.py environment-poc/build/recovery-evidence --core
            else
              timeout 1200 python3 -u scripts/managed-recovery-poc.py environment-poc/build/recovery-evidence --trace-input
            fi
          else
            timeout 900 python3 -u scripts/recovery-environment-poc.py environment-poc/build/recovery-evidence
          fi
      - name: Record measurement status
        if: always()
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('environment-poc/build/recovery-evidence')/('managed-report.json' if '${{ inputs.managed }}'=='true' else 'recovery-report.json')
          r=json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Independent recovery PoC, API '+os.environ['RECOVERY_API']+'\n\n')
              out.write('Managed scope: '+str(r.get('scope','native baseline'))+'\n\n')
              out.write('Configured runtime: '+os.environ['POC_RUNTIME_VARIANT']+'; build only: '+os.environ['POC_BUILD_ONLY']+'\n\n')
              out.write('Measurements complete: '+str(r.get('experimentComplete',False))+'\n\nMeasured recovery gates passed: '+str(r.get('managedControllerReady',r.get('nativeRecoveryReady',False)))+'\n\n')
              out.write('Two-page input diagnostic complete: '+str(r.get('inputDiagnosticComplete',False))+'\n\n')
              out.write('Warning controls complete: '+str(r.get('warningProbeComplete',False))+'\n\n')
              out.write('Formal migration ready: '+str(r.get('formalMigrationReady',False))+'\n\n')
              out.write('No production app, login data, signing key or public release was used. Native capability gaps fail the migration gate; see the report.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.runtime == 'optimized-release' && 'android-optimized-release-runtime' || inputs.managed && 'android-managed-recovery' || 'android-recovery-poc' }}-api-${{ matrix.api }}
          retention-days: 14
          path: |
            android/environment-poc/build/recovery-evidence/
            android/environment-poc/build/reports/lint-results-debug.*
            android/environment-poc/build/reports/lint-results-release.*
