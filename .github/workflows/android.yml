name: Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run WebView isolation tests on an Android 15 emulator
        type: boolean
        default: false
      device_only:
        description: Run only device acceptance against an already built source tree
        type: boolean
        default: false
      ui_only:
        description: Capture native UI only; reuse previously passed isolation results
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.device_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify and build
        working-directory: android
        run: ./gradlew --no-daemon -PunsignedRelease testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
  device:
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install emulator
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Boot and verify
        working-directory: android
        run: |
          mkdir -p app/build/device-evidence
          trap 'tail -100 app/build/device-evidence/emulator.log || true' ERR
          export ANDROID_USER_HOME="$RUNNER_TEMP/profiles-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name profiles-test --device pixel_6 --path "$ANDROID_AVD_HOME/profiles-test.avd" --package 'system-images;android-35;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/profiles-test.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd profiles-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > app/build/device-evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          if [ "${{ inputs.ui_only }}" != true ]; then ./gradlew --no-daemon connectedDebugAndroidTest; fi
          ./gradlew --no-daemon installDebug
          adb shell am start -n com.forcemind.chatgpt.profiles.debug/com.forcemind.chatgpt.profiles.MainActivity
          sleep 15
          python3 scripts/capture-ui.py app/build/device-evidence
          adb shell dumpsys webviewupdate > app/build/device-evidence/webview.txt
          adb shell wm size 1600x2560
          adb shell wm density 240
          sleep 5
          adb exec-out screencap -p > app/build/device-evidence/android-tablet.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/device-evidence/
