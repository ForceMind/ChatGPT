name: Android
on:
  push:
    paths: ['android/**', '!android/ui-preview/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '!android/ui-preview/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run WebView isolation tests on an Android 15 emulator
        type: boolean
        default: false
      device_only:
        description: Run only device acceptance against an already built source tree
        type: boolean
        default: false
      ui_only:
        description: Capture native UI only; reuse previously passed isolation results
        type: boolean
        default: false
      workbench_only:
        description: Verify native workbench fixtures only; skip external ChatGPT screenshot
        type: boolean
        default: false
      website_capture_only:
        description: Capture real native asset and Skill screens with labelled demo files; no external webpage
        type: boolean
        default: false
      homepage_capture_only:
        description: Capture only the actual anonymous ChatGPT homepage; no login or message actions
        type: boolean
        default: false
      homepage_android16:
        description: Use the Android 16 image for the isolated homepage compatibility probe
        type: boolean
        default: false
      icon_only:
        description: Verify packaged adaptive icons and capture Android system app details without opening ChatGPT
        type: boolean
        default: false
      handoff_only:
        description: Run the native attachment handoff flow on phone and tablet only
        type: boolean
        default: false
      capabilities_only:
        description: Verify complete Skill/role library, role-only and combined file tasks on phone/tablet
        type: boolean
        default: false
      readability_only:
        description: Verify native UI at 1.0, 1.3 and 2.0 system font scales plus handoff and retained tabs on phone/tablet
        type: boolean
        default: false
      recovery_only:
        description: Verify page recovery, live account/tab reuse and handoff on phone and tablet
        type: boolean
        default: false
      environment_probe_only:
        description: Measure public per-profile locale APIs offline on one emulator engine
        type: boolean
        default: false
      process_restart_only:
        description: Verify saved draft and reading recovery through a real process force-stop
        type: boolean
        default: false
      standalone_environment_poc:
        description: Build and measure only the independent Gecko environment PoC
        type: boolean
        default: false
      grouped_environment_poc:
        description: Run independent three-account grouped versus separate Gecko environment experiment
        type: boolean
        default: false
      lifecycle_only:
        description: Native lifecycle/retention and resource matrix, no instrumentation or real ChatGPT
        type: boolean
        default: false
      lifecycle_apis:
        description: JSON list of official Google APIs x86_64 system image levels (28 through 36)
        type: string
        default: '[35]'
      lifecycle_seconds:
        description: Background hold seconds (330 for long retention acceptance)
        type: string
        default: '330'
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (!inputs.device_only && !inputs.standalone_environment_poc && !inputs.grouped_environment_poc && !inputs.lifecycle_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify and build
        working-directory: android
        run: ./gradlew --no-daemon -PunsignedRelease testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify application label and stable package ID
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/branding-badging.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          text=Path('app/build/branding-badging.txt').read_text()
          assert "name='com.forcemind.chatgpt.profiles.debug'" in text
          assert "application-label:'ChatGPT Studio'" in text
          print('ChatGPT Studio label and stable Android application ID verified')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
  device:
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests && !inputs.standalone_environment_poc && !inputs.grouped_environment_poc && !inputs.lifecycle_only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROFILES_IMAGE_API: ${{ inputs.homepage_android16 && inputs.homepage_capture_only && '36' || '35' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install emulator
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' "system-images;android-${PROFILES_IMAGE_API};google_apis;x86_64"
      - name: Boot and verify
        working-directory: android
        run: |
          mkdir -p app/build/device-evidence
          trap 'tail -100 app/build/device-evidence/emulator.log || true' ERR
          export ANDROID_USER_HOME="$RUNNER_TEMP/profiles-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # Both emulator and adb must inherit this fresh home. Start adb first
          # so the emulator receives its public key instead of waiting forever
          # for authorization against a daemon from the runner's previous home.
          adb kill-server || true
          adb start-server
          avdmanager create avd --force --name profiles-test --device pixel_6 --path "$ANDROID_AVD_HOME/profiles-test.avd" --package "system-images;android-${PROFILES_IMAGE_API};google_apis;x86_64"
          test -f "$ANDROID_AVD_HOME/profiles-test.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd profiles-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan > app/build/device-evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          collect_failure() {
            result=$?
            if [ "$result" -ne 0 ]; then
              timeout 20 adb pull /sdcard/Download/ProfilesFixtureEvidence app/build/device-evidence/failed-workbench || true
              timeout 20 adb exec-out screencap -p > app/build/device-evidence/failure-screen.png || true
              timeout 20 adb shell uiautomator dump --compressed /sdcard/profiles-failure.xml || true
              timeout 20 adb pull /sdcard/profiles-failure.xml app/build/device-evidence/failure-ui.xml || true
              timeout 20 adb logcat -d -s AndroidRuntime:E > app/build/device-evidence/failure-runtime.log || true
              timeout 20 adb shell dumpsys webviewupdate > app/build/device-evidence/webview.txt || true
            fi
            return "$result"
          }
          trap collect_failure EXIT
          adb shell input keyevent 82
          # The CI image's Pixel Launcher can ANR during headless startup. It is
          # not needed for explicit Activity launches; App ANR reporting stays on.
          if [ "${{ inputs.icon_only }}" != true ]; then
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
          fi
          if [ "${{ inputs.icon_only }}" = true ]; then
            ./gradlew --no-daemon '-Pandroid.testInstrumentationRunnerArguments.class=com.forcemind.chatgpt.profiles.LauncherIconTest' connectedDebugAndroidTest
            adb pull /sdcard/Download/ProfilesIconEvidence app/build/device-evidence/icons
            # Connected tests may uninstall their target APK during cleanup.
            # Reinstall the same already-built package before opening Settings.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            timeout 120 python3 -u scripts/capture-icon-settings.py app/build/device-evidence
            echo 'Packaged Android adaptive and monochrome icon rendering plus actual system app details; no webpage, login or personal account interaction.' > app/build/device-evidence/scope.txt
            exit 0
          fi
          if [ "${{ inputs.homepage_capture_only }}" = true ]; then
            ./gradlew --no-daemon installDebug
            timeout 20 adb shell dumpsys webviewupdate > app/build/device-evidence/webview.txt
            timeout 240 python3 -u scripts/capture-homepage.py app/build/device-evidence
            timeout 20 adb shell dumpsys webviewupdate > app/build/device-evidence/webview.txt
            echo 'Actual anonymous ChatGPT homepage on a fresh emulator; no login, message, file upload or fixture webpage.' > app/build/device-evidence/scope.txt
            exit 0
          fi
          if [ "${{ inputs.website_capture_only }}" = true ]; then
            ./gradlew --no-daemon -Pandroid.testInstrumentationRunnerArguments.fixtureMode=true '-Pandroid.testInstrumentationRunnerArguments.class=com.forcemind.chatgpt.profiles.WorkbenchTest#websiteShowsActualNativeAssetsWithExplicitDemoFiles' connectedDebugAndroidTest
            adb pull /sdcard/Download/ProfilesFixtureEvidence app/build/device-evidence/website
            echo 'Actual Android native asset and Skill UI on an emulator, labelled demo files. No ChatGPT webpage or real account acceptance.' > app/build/device-evidence/scope.txt
            exit 0
          fi
          if [ "${{ inputs.process_restart_only }}" = true ]; then
            ./gradlew --no-daemon installDebug
            timeout 240 python3 -u scripts/verify-process-restart.py app/build/device-evidence
            echo 'Actual process restart with offline fixtures only; no real ChatGPT acceptance.' > app/build/device-evidence/scope.txt
            exit 0
          fi
          if [ "${{ inputs.ui_only }}" != true ]; then
            phone_filter=()
            tablet_filter='com.forcemind.chatgpt.profiles.WorkbenchTest'
            if [ "${{ inputs.handoff_only }}" = true ]; then
              tablet_filter='com.forcemind.chatgpt.profiles.WorkbenchTest#assetDialogHandsActualFilesToTargetWebpageAndSendsOnce'
              phone_filter=("-Pandroid.testInstrumentationRunnerArguments.class=$tablet_filter")
            fi
            if [ "${{ inputs.capabilities_only }}" = true ]; then
              tablet_filter='com.forcemind.chatgpt.profiles.WorkbenchTest#allProjectSkillsAreVisibleAndNativeSearchFiltersThem,com.forcemind.chatgpt.profiles.WorkbenchTest#originalRoleAloneUsesNoDefaultSkillAndSubmitsExactlyOnce,com.forcemind.chatgpt.profiles.WorkbenchTest#assetDialogHandsActualFilesToTargetWebpageAndSendsOnce'
              phone_filter=("-Pandroid.testInstrumentationRunnerArguments.class=$tablet_filter")
            fi
            if [ "${{ inputs.recovery_only }}" = true ]; then
              tablet_filter='com.forcemind.chatgpt.profiles.WorkbenchTest#draftsAndReadingRestoreAcrossRecreationAndPreserveConflicts,com.forcemind.chatgpt.profiles.WorkbenchTest#encryptedSnapshotIsReadOnlyAccountScopedAndReconnectsWithoutSending,com.forcemind.chatgpt.profiles.WorkbenchTest#sameTabNavigationDoesNotAttachAnOldConversationSnapshotToANewUrl,com.forcemind.chatgpt.profiles.WorkbenchTest#authenticationFailureRevealsTheLivePageWithoutRestoringDraftIntoIt,com.forcemind.chatgpt.profiles.WorkbenchTest#switchingAccountsAndUndoCloseReuseTheLivePage,com.forcemind.chatgpt.profiles.WorkbenchTest#assetDialogHandsActualFilesToTargetWebpageAndSendsOnce,com.forcemind.chatgpt.profiles.WorkbenchTest#windowRecreationAndNativeTabCardsKeepVisitedPagesAndCustomTitles'
              phone_filter=("-Pandroid.testInstrumentationRunnerArguments.class=$tablet_filter")
            fi
            if [ "${{ inputs.readability_only }}" = true ]; then
              tablet_filter='com.forcemind.chatgpt.profiles.WorkbenchTest#nativeUiRemainsReadableAtSystemFontScales,com.forcemind.chatgpt.profiles.WorkbenchTest#assetDialogHandsActualFilesToTargetWebpageAndSendsOnce,com.forcemind.chatgpt.profiles.WorkbenchTest#windowRecreationAndNativeTabCardsKeepVisitedPagesAndCustomTitles'
              phone_filter=("-Pandroid.testInstrumentationRunnerArguments.class=$tablet_filter")
            fi
            if [ "${{ inputs.environment_probe_only }}" = true ]; then
              phone_filter=("-Pandroid.testInstrumentationRunnerArguments.class=com.forcemind.chatgpt.profiles.WorkbenchTest#publicProfileLanguageCapabilitiesAreMeasuredAcrossFramesAndWorkers")
            fi
            ./gradlew --no-daemon -Pandroid.testInstrumentationRunnerArguments.fixtureMode=true "${phone_filter[@]}" connectedDebugAndroidTest
            cp -R app/build/outputs/androidTest-results app/build/device-evidence/phone-test-results
            adb pull /sdcard/Download/ProfilesFixtureEvidence app/build/device-evidence/workbench-phone
            if [ "${{ inputs.environment_probe_only }}" = true ]; then
              echo 'Offline locale API capability probe only; no product preference or real ChatGPT acceptance.' > app/build/device-evidence/scope.txt
              exit 0
            fi
            adb shell wm size 1600x2560
            adb shell wm density 240
            ./gradlew --no-daemon --rerun-tasks -Pandroid.testInstrumentationRunnerArguments.fixtureMode=true "-Pandroid.testInstrumentationRunnerArguments.class=$tablet_filter" connectedDebugAndroidTest
            adb pull /sdcard/Download/ProfilesFixtureEvidence app/build/device-evidence/workbench-tablet
            adb shell wm size reset
            adb shell wm density reset
          fi
          if [ "${{ inputs.workbench_only }}" = true ] || [ "${{ inputs.recovery_only }}" = true ] || [ "${{ inputs.handoff_only }}" = true ] || [ "${{ inputs.readability_only }}" = true ] || [ "${{ inputs.capabilities_only }}" = true ]; then
            test "${{ inputs.ui_only }}" != true
            echo 'Native workbench fixture tests only. Real ChatGPT UI and accounts were not verified.' > app/build/device-evidence/scope.txt
            exit 0
          fi
          ./gradlew --no-daemon installDebug
          adb shell am start -n com.forcemind.chatgpt.profiles.debug/com.forcemind.chatgpt.profiles.MainActivity
          sleep 15
          timeout 20 adb exec-out screencap -p > app/build/device-evidence/main-start.png
          timeout 20 adb shell uiautomator dump --compressed /sdcard/profiles-start.xml
          timeout 20 adb exec-out cat /sdcard/profiles-start.xml > app/build/device-evidence/main-start.xml
          timeout 20 adb logcat -d -s AndroidRuntime:E > app/build/device-evidence/main-runtime.log
          timeout 240 python3 -u scripts/capture-ui.py app/build/device-evidence
          timeout 20 adb shell dumpsys webviewupdate > app/build/device-evidence/webview.txt
          timeout 20 adb shell wm size 1600x2560
          timeout 20 adb shell wm density 240
          sleep 5
          timeout 20 adb exec-out screencap -p > app/build/device-evidence/android-tablet.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-evidence
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/device-evidence/
  environment-poc:
    if: github.event_name == 'workflow_dispatch' && (inputs.standalone_environment_poc || inputs.grouped_environment_poc)
    uses: ./.github/workflows/android-environment-poc.yml
    with:
      grouped: ${{ inputs.grouped_environment_poc }}
  lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.lifecycle_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: ${{ fromJSON(inputs.lifecycle_apis || '[35]') }}
    env:
      STUDIO_API: ${{ matrix.api }}
      STUDIO_HOLD_SECONDS: ${{ inputs.lifecycle_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate matrix and install official emulator packages
        run: |
          python3 -c 'import os; assert 28 <= int(os.environ["STUDIO_API"]) <= 36; assert 10 <= int(os.environ["STUDIO_HOLD_SECONDS"]) <= 900'
          python3 -c 'import ast; ast.parse(open("android/scripts/verify-lifecycle.py").read())'
          sudo chmod 666 /dev/kvm
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' emulator "system-images;android-${STUDIO_API};google_apis;x86_64"
      - name: Build isolated debug application
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Native lifecycle and resources
        working-directory: android
        run: |
          mkdir -p app/build/lifecycle-evidence
          export ANDROID_USER_HOME="$RUNNER_TEMP/studio-lifecycle-${STUDIO_API}"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          adb kill-server || true
          adb start-server
          avdmanager create avd --force --name studio-lifecycle --device pixel_6 --path "$ANDROID_AVD_HOME/studio-lifecycle.avd" --package "system-images;android-${STUDIO_API};google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd studio-lifecycle -memory 2048 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan > app/build/lifecycle-evidence/emulator.log 2>&1 &
          trap 'adb logcat -d -s AndroidRuntime:E > app/build/lifecycle-evidence/runtime.log || true; adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb root > app/build/lifecycle-evidence/adb-root.txt 2>&1 || true
          timeout 60 adb wait-for-device
          adb shell input keyevent 82
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          timeout 1000 python3 -u scripts/verify-lifecycle.py app/build/lifecycle-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lifecycle-api-${{ matrix.api }}
          retention-days: 14
          path: android/app/build/lifecycle-evidence/
