name: Android Live Network Panel Candidate
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/android-network-panel-candidate.yml']
  workflow_dispatch:
    inputs:
      deliver_verified_only:
        description: Repackage the already verified run 42003462509 with current installation notes, without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ !inputs.deliver_verified_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STUDIO_BETA_STORE_PASSWORD: ${{ secrets.STUDIO_BETA_STORE_PASSWORD }}
      STUDIO_BETA_MODE: '1'
      BETA_VERSION_CODE: '3000028'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
            android/app/libs/licenses/
          key: formal-network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/go.sum', 'android/network-poc/corebridge/networkcore.go', 'android/network-poc/scripts/build-core.sh', 'android/scripts/prepare-network-core.sh') }}
      - run: bash android/scripts/prepare-network-core.sh
      - name: Restore existing fixed Beta signer
        env:
          STUDIO_BETA_KEYSTORE_B64: ${{ secrets.STUDIO_BETA_KEYSTORE_B64 }}
        run: python3 android/scripts/restore-beta-signing.py
      - name: Check and build real network management candidate
        run: |
          test ! -f android/keystore.properties
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          bash android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:lintNetworkBeta
          bash android/gradlew -p android --no-daemon -PbetaNetworkUi -PbetaVersionCode=3000028 -PbetaVersionName=3.0.0-alpha.24-beta.4 :app:assembleNetworkBeta :app:assembleNetworkBetaAndroidTest
          python3 android/scripts/package-network-preview.py
          cp android/app/build/outputs/apk/androidTest/networkBeta/app-networkBeta-androidTest.apk android/app/build/network-beta/panel-test.apk
          bash android/gradlew -p android --no-daemon -PbetaNetworkUi -PbetaAbi=x86_64 -PbetaVersionCode=3000028 -PbetaVersionName=3.0.0-alpha.24-beta.4 :app:assembleNetworkBeta
          cp android/app/build/outputs/apk/networkBeta/app-networkBeta.apk android/app/build/network-beta/candidate-x86.apk
      - uses: actions/upload-artifact@v4
        with:
          name: network-panel-input
          retention-days: 14
          path: android/app/build/network-beta/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-panel-build-evidence
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - name: Clean transient signer
        if: always()
        run: rm -f "$RUNNER_TEMP/studio-beta.p12"
  native-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: network-panel-input
          path: android/app/build/network-panel-input
      - uses: actions/download-artifact@v4
        if: matrix.api == 35
        with:
          name: ChatGPT-Studio-Fixed-Beta3-Compatibility-Candidate
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/network-panel-baseline
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: beta-continuation-input
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/network-panel-ci-baseline
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/app/build/network-panel-ci-baseline/provider --output android/app/build/network-panel-evidence/provider; fi
            python3 android/scripts/run-network-panel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-panel-api-${{ matrix.api }}
          retention-days: 14
          path: android/app/build/network-panel-evidence/
  deliver:
    needs: native-ui
    if: ${{ always() && (inputs.deliver_verified_only || needs.native-ui.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable prior acceptance and unchanged Android source for notes-only delivery
        if: inputs.deliver_verified_only
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/42003462509 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/runs/42003462509 --jq .head_sha)" = b45a53f0d06b96a8ed9af9020d062ec537cfaea6
          git fetch origin b45a53f0d06b96a8ed9af9020d062ec537cfaea6 --depth=1
          git diff --exit-code b45a53f0d06b96a8ed9af9020d062ec537cfaea6 HEAD -- android
      - uses: actions/download-artifact@v4
        with:
          name: network-panel-input
          run-id: ${{ inputs.deliver_verified_only && 42003462509 || github.run_id }}
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: network-panel-api-28
          run-id: ${{ inputs.deliver_verified_only && 42003462509 || github.run_id }}
          github-token: ${{ github.token }}
          path: api28
      - uses: actions/download-artifact@v4
        with:
          name: network-panel-api-35
          run-id: ${{ inputs.deliver_verified_only && 42003462509 || github.run_id }}
          github-token: ${{ github.token }}
          path: api35
      - name: Gate real user candidate on native functionality and data checks
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          reports = [json.loads(pathlib.Path(f'api{api}/verified.json').read_text()) for api in (28,35)]
          assert all(r['complete'] for r in reports)
          receipt = json.loads(pathlib.Path('input/receipt.json').read_text())
          assert receipt['versionCode'] == 3000028
          assert hashlib.sha256(pathlib.Path('input',receipt['file']).read_bytes()).hexdigest() == receipt['sha256'] == reports[1]['candidateInstalledSHA256']
          out = pathlib.Path('candidate'); out.mkdir()
          for name in (receipt['file'], 'receipt.json', 'SHA256SUMS.txt', 'LICENSE', 'network-core-dependencies.json'):
              shutil.copyfile(pathlib.Path('input',name),out/name)
          shutil.copytree('input/licenses',out/'licenses')
          shutil.copyfile('docs/android-network-panel-install.md',out/'INSTALL.md')
          (out/'native-network-panel-acceptance.json').write_text(json.dumps(reports,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Studio-Beta4-Live-Network-Candidate
          retention-days: 14
          path: candidate/
