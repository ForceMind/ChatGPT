name: macOS anonymous webpage verification
on:
  workflow_dispatch:
    inputs:
      verify_draft:
        description: Type a fixed harmless draft in fresh CI data, without login, upload or send
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Build current application without packaging
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Check actual anonymous ChatGPT composer without login, upload or send
        working-directory: desktop
        run: node scripts/check-live-page.mjs ${{ inputs.verify_draft && '--verify-draft' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.verify_draft && 'macos-live-draft-evidence' || 'macos-live-readonly-evidence' }}
          retention-days: 14
          path: desktop/release/live-readonly/
