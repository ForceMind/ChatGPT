name: Android delta same APK runtime retry
'on': workflow_dispatch
permissions:
  contents: read
  actions: read
env:
  STUDIO_DELTA_SOURCE_SHA: 2a4b5223760d52cc45e41b6d7fa6f15c50cd67b8
jobs:
  emulator:
    if: github.ref == 'refs/heads/validation/android-delta-runtime-retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STUDIO_DELTA_SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-app-update-ci-inputs
          run-id: 43086437641
          github-token: ${{ github.token }}
          path: android/app/build/app-update-ci
      - name: Retry the existing Android 15 case with the owned emulator bootstrap
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$STUDIO_DELTA_SOURCE_SHA"
          sdkmanager 'build-tools;35.0.0'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          chmod +x android/app/build/app-update-ci/xray
          mkdir -p android/app/build/app-update-evidence
          echo "$GITHUB_SHA" > android/app/build/app-update-evidence/retry-harness-sha.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/scripts/run-environment-api35.sh')
          s = p.read_text()
          marker = "  *) echo 'Only the approved owned validation scripts may run.'"
          assert s.count(marker) == 1
          s = s.replace(marker, "  android/scripts/run-app-update-candidate.py) studio_evidence=android/app/build/app-update-evidence ;;\n" + marker)
          s = s.replace('adb push android/app/build/environment-ascii/input.jar /data/local/tmp/studio-poc-ascii-input.jar\n', '')
          needle = 'python3 "$studio_validation_script"'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + ' --input android/app/build/app-update-ci --output android/app/build/app-update-evidence/runtime --api 35 --auto-only --delta-mode corrupt')
          p.write_text(s)
          PY
          env GITHUB_SHA="$STUDIO_DELTA_SOURCE_SHA" bash android/scripts/run-environment-api35.sh android/scripts/run-app-update-candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-update-api-35-corrupt
          path: android/app/build/app-update-evidence/
          if-no-files-found: error
  delivery:
    needs: emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STUDIO_DELTA_SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: android-app-update-unsigned-review
          run-id: 43086437641
          github-token: ${{ github.token }}
          path: android/app/build/app-update-review
      - uses: actions/download-artifact@v4
        with:
          pattern: android-app-update-api-28-*
          run-id: 43086437641
          github-token: ${{ github.token }}
          path: android/app/build/app-update-evidence
      - uses: actions/download-artifact@v4
        with:
          name: android-app-update-api-35-valid
          run-id: 43086437641
          github-token: ${{ github.token }}
          path: android/app/build/app-update-evidence/android-app-update-api-35-valid
      - uses: actions/download-artifact@v4
        with:
          name: android-app-update-api-35-corrupt
          path: android/app/build/app-update-evidence/android-app-update-api-35-corrupt
      - name: Apply the original acceptance checks to the four same-build proofs
        env:
          STUDIO_APP_UPDATE_AUTO: 'true'
          STUDIO_UPDATE_DELTA_VALIDATION: 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$STUDIO_DELTA_SOURCE_SHA"
          sed -i "s@ref.startswith('refs/heads/release/android-')@ref == 'refs/heads/validation/android-delta-runtime-retry'@" android/scripts/verify-app-update-candidate.py
          env GITHUB_SHA="$STUDIO_DELTA_SOURCE_SHA" python3 android/scripts/verify-app-update-candidate.py \
            --review android/app/build/app-update-review --evidence android/app/build/app-update-evidence \
            --out android/app/build/app-update-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-update-acceptance
          path: android/app/build/app-update-acceptance.json
          if-no-files-found: error
