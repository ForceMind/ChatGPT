name: Android new transport file proof
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-https-files:
    if: github.ref == 'refs/heads/validation/android-new-transport-files'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: false
      - name: Verify HTTPS upload and download through owned transport fixtures
        working-directory: android/network-poc/corebridge
        shell: bash
        run: |
          go test -v -count=1 -run '^TestOwnedTransportMatrix$/(ws|ws-tls|tcp-http)$' . | tee "$RUNNER_TEMP/owned-transport-file-proof.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-transport-file-proof
          path: ${{ runner.temp }}/owned-transport-file-proof.log
          if-no-files-found: error
          retention-days: 14
