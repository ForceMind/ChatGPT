name: Android Network Integration Candidate
on:
  push:
    branches: [dev]
    paths: ['android/**', '.github/workflows/android-network-integration.yml']
  workflow_dispatch:
    inputs:
      foreground_diagnostic:
        description: Reuse d0b8db4 inputs; Android 15 foreground only
        type: boolean
        default: false
      stream_guest_log:
        description: Keep continuous adb logcat connection (disable for controlled diagnosis)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.foreground_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
            android/app/libs/licenses/
          key: formal-network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/go.sum', 'android/network-poc/corebridge/networkcore.go', 'android/network-poc/scripts/build-core.sh', 'android/scripts/prepare-network-core.sh') }}
      - name: Build the exact validated core
        run: bash android/scripts/prepare-network-core.sh
      - name: Prepare owned synthetic trust
        run: python3 android/network-poc/scripts/fixture.py --prepare-only --output android/network-poc/secure-fixture
      - name: Check and compile the formal client
        working-directory: android
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          bash gradlew --no-daemon -PunsignedRelease :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          bash gradlew --no-daemon -PnetworkIntegration :app:assembleNetworkCi :app:assembleNetworkCiAndroidTest
      - uses: actions/checkout@v4
        with:
          ref: b44e564deaed09efea7be3d68349d2198dede46b
          path: baseline-upgrade
      - name: Build old client with the same synthetic data test
        run: |
          cp android/app/src/androidTest/java/com/forcemind/chatgpt/profiles/NetworkUpgradeCompatibilityTest.java baseline-upgrade/android/app/src/androidTest/java/com/forcemind/chatgpt/profiles/
          cp android/app/src/androidTest/java/com/forcemind/chatgpt/profiles/NetworkBenchmarkTest.java baseline-upgrade/android/app/src/androidTest/java/com/forcemind/chatgpt/profiles/
          bash baseline-upgrade/android/gradlew -p baseline-upgrade/android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p android/app/build/upgrade-inputs
          cp baseline-upgrade/android/app/build/outputs/apk/debug/app-debug.apk android/app/build/upgrade-inputs/baseline-debug.apk
          cp baseline-upgrade/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android/app/build/upgrade-inputs/baseline-test.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/upgrade-inputs/candidate-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: formal-network-upgrade-inputs
          retention-days: 14
          path: android/app/build/upgrade-inputs/
      - name: Prepare matched resource inputs
        run: |
          mkdir -p android/app/build/performance-inputs
          cp android/app/build/upgrade-inputs/baseline-debug.apk android/app/build/performance-inputs/
          cp android/app/build/upgrade-inputs/baseline-test.apk android/app/build/performance-inputs/
          cp android/app/build/outputs/apk/networkCi/app-networkCi.apk android/app/build/performance-inputs/candidate-networkci.apk
          cp android/app/build/outputs/apk/androidTest/networkCi/app-networkCi-androidTest.apk android/app/build/performance-inputs/candidate-networkci-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: formal-network-performance-inputs
          retention-days: 14
          path: android/app/build/performance-inputs/
      - name: Record candidate identity and packaged isolation
        run: python3 android/scripts/network-candidate-evidence.py
      - name: Prepare unsigned arm64 review candidate
        run: python3 android/scripts/package-network-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Studio-Network-Candidate-Android-arm64-UNSIGNED
          retention-days: 14
          path: android/app/build/network-candidate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-network-build
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/
            android/app/libs/core-manifest.json
            android/app/libs/dependencies.json
            android/app/libs/licenses/
      - uses: actions/upload-artifact@v4
        with:
          name: formal-network-fixture
          retention-days: 1
          path: android/network-poc/secure-fixture/
      - name: Prepare pinned Android 9 WebView
        run: python3 android/network-poc/scripts/prepare-webview.py --output android/network-poc/webview-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: formal-network-provider
          retention-days: 14
          path: android/network-poc/webview-fixture/
      - uses: actions/upload-artifact@v4
        with:
          name: formal-network-host-core
          retention-days: 14
          path: android/network-poc/corebridge/bin/xray
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
        transport: [raw, tls, reality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-build
          path: android/app
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-fixture
          path: android/network-poc/secure-fixture
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-host-core
          path: android/network-poc/corebridge/bin
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: formal-network-provider
          path: android/network-poc/webview-fixture
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Start owned fixtures
        run: |
          chmod +x android/network-poc/corebridge/bin/xray
          python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture > "$RUNNER_TEMP/formal-network-fixture.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if [ -f android/network-poc/secure-fixture/ready.json ]; then break; fi
            sleep 1
          done
          test -f android/network-poc/secure-fixture/ready.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/network-poc/webview-fixture --output android/app/build/network-evidence/provider; fi
            adb install -r -t android/app/build/outputs/apk/networkCi/app-networkCi.apk
            adb install -r -t android/app/build/outputs/apk/androidTest/networkCi/app-networkCi-androidTest.apk
            python3 android/scripts/run-network-integration.py --transport '${{ matrix.transport }}' --output android/app/build/network-evidence
      - name: Preserve evidence without image capture
        if: always()
        run: |
          mkdir -p android/app/build/network-evidence
          timeout 15 adb logcat -d -t 5000 > android/app/build/network-evidence/logcat.txt 2>&1 || true
          cp "$RUNNER_TEMP/formal-network-fixture.log" android/app/build/network-evidence/fixture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-network-api-${{ matrix.api }}-${{ matrix.transport }}
          retention-days: 14
          path: android/app/build/network-evidence/

  upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-upgrade-inputs
          path: android/app/build/upgrade-inputs
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: formal-network-provider
          path: android/network-poc/webview-fixture
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable isolated emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/network-poc/webview-fixture --output android/app/build/upgrade-evidence/provider; fi
            python3 android/scripts/run-network-upgrade.py --inputs android/app/build/upgrade-inputs --output android/app/build/upgrade-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-network-upgrade-api-${{ matrix.api }}
          retention-days: 14
          path: android/app/build/upgrade-evidence/

  resources:
    needs: [build, device, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
        background: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-performance-inputs
          path: android/app/build/performance-inputs
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-fixture
          path: android/network-poc/secure-fixture
      - uses: actions/download-artifact@v4
        with:
          name: formal-network-host-core
          path: android/network-poc/corebridge/bin
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: formal-network-provider
          path: android/network-poc/webview-fixture
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Owned resource fixture and acceleration
        run: |
          chmod +x android/network-poc/corebridge/bin/xray
          python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture > "$RUNNER_TEMP/formal-resource-fixture.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if [ -f android/network-poc/secure-fixture/ready.json ]; then break; fi
            sleep 1
          done
          test -f android/network-poc/secure-fixture/ready.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/network-poc/webview-fixture --output android/app/build/resource-evidence/provider; fi
            python3 android/scripts/measure-network-integration.py --inputs android/app/build/performance-inputs --output android/app/build/resource-evidence ${{ matrix.background && '--background' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-network-resources-api-${{ matrix.api }}-background-${{ matrix.background }}
          retention-days: 14
          path: android/app/build/resource-evidence/

  foreground_diagnostic:
    if: ${{ inputs.foreground_diagnostic }}
    env:
      NETWORK_SOURCE_SHA: d0b8db47f0ff029d7f9ca0ff784281e0a1307b73
      NETWORK_LOG_STREAM: ${{ inputs.stream_guest_log && '1' || '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35]
        background: [false]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41713812139
          github-token: ${{ github.token }}
          name: formal-network-performance-inputs
          path: android/app/build/performance-inputs
      - uses: actions/download-artifact@v4
        with:
          run-id: 41713812139
          github-token: ${{ github.token }}
          name: formal-network-fixture
          path: android/network-poc/secure-fixture
      - uses: actions/download-artifact@v4
        with:
          run-id: 41713812139
          github-token: ${{ github.token }}
          name: formal-network-host-core
          path: android/network-poc/corebridge/bin
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: formal-network-provider
          path: android/network-poc/webview-fixture
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Owned resource fixture and acceleration
        run: |
          chmod +x android/network-poc/corebridge/bin/xray
          python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture > "$RUNNER_TEMP/formal-resource-fixture.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if [ -f android/network-poc/secure-fixture/ready.json ]; then break; fi
            sleep 1
          done
          test -f android/network-poc/secure-fixture/ready.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/network-poc/webview-fixture --output android/app/build/resource-evidence/provider; fi
            python3 android/scripts/measure-network-integration.py --inputs android/app/build/performance-inputs --output android/app/build/resource-evidence ${{ matrix.background && '--background' || '' }}
      - name: Preserve host diagnostics
        if: always()
        run: |
          mkdir -p android/app/build/resource-evidence/host
          sudo dmesg -T > android/app/build/resource-evidence/host/kernel.txt 2>&1 || true
          free -m > android/app/build/resource-evidence/host/memory.txt
          ps -eo pid,ppid,rss,stat,comm > android/app/build/resource-evidence/host/processes.txt
          find /tmp -maxdepth 3 -type f -name '*crash*.txt' -exec cp --backup=numbered '{}' android/app/build/resource-evidence/host/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-network-resources-api-${{ matrix.api }}-background-${{ matrix.background }}
          retention-days: 14
          path: android/app/build/resource-evidence/
