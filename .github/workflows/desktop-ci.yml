name: Compare exact public update package deltas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-delta:
    if: github.ref == 'refs/heads/validation/release-delta'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        platform: [android, macos, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install the isolated comparison tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xdelta3
          xdelta3 -V
      - name: Verify inputs and reconstruct the exact target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 desktop/scripts/measure-release-delta.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-delta-${{ matrix.platform }}
          path: ${{ runner.temp }}/studio-delta-report.json
          if-no-files-found: error
