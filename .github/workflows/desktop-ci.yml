name: Desktop CI
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Typecheck, lint, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies without downloading Electron
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
  build:
    name: Build on macOS
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies without downloading Electron
        run: npm ci --ignore-scripts
      - name: Build main process, native helpers and renderer
        run: npm run build
