name: Publish verified Android date Beta
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/publish-android-date-beta.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify uploaded original digests and finalize the Beta tag without reuploading
        run: python3 android/scripts/publish-date-beta.py --finalize-existing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-date-beta-publication-receipt
          retention-days: 14
          path: android-beta-publication-receipt.json
