name: Android Environment PoC
on:
  workflow_call:
    inputs:
      grouped:
        type: boolean
        required: false
        default: false
      clear_only:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build standalone experiment
        working-directory: android
        run: |
          if [ "${{ inputs.grouped }}" = true ]; then python3 -m unittest discover -s scripts/tests -p 'test_grouped_environment.py' -v; fi
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          ./environment-poc/gradlew -p environment-poc --no-daemon assembleDebug lintDebug
      - name: Verify isolation and measure resources
        working-directory: android
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p environment-poc/build/evidence
          export ANDROID_USER_HOME="$RUNNER_TEMP/environment-poc"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name environment-poc --device pixel_6 --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd environment-poc -memory 4096 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > environment-poc/build/evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          python3 - <<'PY'
          import os, subprocess
          output=subprocess.check_output(['adb','devices'],text=True)
          devices=[line.split()[0] for line in output.splitlines()[1:] if line.endswith('\tdevice')]
          assert os.environ.get('GITHUB_ACTIONS')=='true' and len(devices)==1 and devices[0].startswith('emulator-'), 'Only the isolated CI emulator may be modified'
          assert subprocess.check_output(['adb','-s',devices[0],'shell','getprop','ro.kernel.qemu'],text=True).strip()=='1'
          PY
          adb shell input keyevent 82
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
          adb install environment-poc/build/outputs/apk/debug/environment-poc-x86_64-debug.apk
          if [ "${{ inputs.clear_only }}" = true ]; then
            timeout 300 python3 -u scripts/grouped-clear-smoke.py environment-poc/build/evidence
          elif [ "${{ inputs.grouped }}" = true ]; then
            timeout 900 python3 -u scripts/grouped-environment-poc.py environment-poc/build/evidence
          else
            timeout 900 python3 -u scripts/environment-poc.py environment-poc/build/evidence
          fi
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.grouped
        with:
          name: android-environment-poc
          path: |
            android/environment-poc/build/outputs/apk/debug/*.apk
            android/environment-poc/build/evidence/
            android/environment-poc/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        if: always() && inputs.grouped
        with:
          name: ${{ inputs.clear_only && 'android-grouped-clear-evidence' || 'android-grouped-environment-evidence' }}
          retention-days: 14
          path: |
            android/environment-poc/build/evidence/
            android/environment-poc/build/reports/lint-results-debug.*
