name: Promote validated desktop artifacts to draft
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft tag matching the checked release manifest
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64-dmg
          run-id: 40087980342
          github-token: ${{ github.token }}
          path: promotion/mac-dmg
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64-zip
          run-id: 40087980342
          github-token: ${{ github.token }}
          path: promotion/mac-zip
      - uses: actions/download-artifact@v4
        with:
          name: mac-release-info
          run-id: 40087980342
          github-token: ${{ github.token }}
          path: promotion/mac-info
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          run-id: 40089162364
          github-token: ${{ github.token }}
          path: promotion/windows-installer
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-zip
          run-id: 40089162364
          github-token: ${{ github.token }}
          path: promotion/windows-zip
      - name: Verify frozen inputs and promote without overwriting assets
        run: node desktop/scripts/promote-validated-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-verification
          retention-days: 30
          path: promotion/promotion-verification.json
