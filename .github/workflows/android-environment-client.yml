name: Android Environment Client Candidate
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/android-environment-client.yml']
  workflow_dispatch:
    inputs:
      reuse_application_build:
        description: Reuse checked application/test bytes and human upgrades from 42034191686 when only the functional driver changed
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STUDIO_BETA_STORE_PASSWORD: ${{ secrets.STUDIO_BETA_STORE_PASSWORD }}
      STUDIO_BETA_MODE: '1'
      BETA_VERSION_CODE: '3000029'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: ${{ !inputs.reuse_application_build }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: ${{ !inputs.reuse_application_build }}
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        if: ${{ !inputs.reuse_application_build }}
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        if: ${{ !inputs.reuse_application_build }}
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
            android/app/libs/licenses/
          key: formal-network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/go.sum', 'android/network-poc/corebridge/networkcore.go', 'android/network-poc/scripts/build-core.sh', 'android/scripts/prepare-network-core.sh') }}
      - run: bash android/scripts/prepare-network-core.sh
        if: ${{ !inputs.reuse_application_build }}
      - name: Restore existing fixed Beta signer
        if: ${{ !inputs.reuse_application_build }}
        env:
          STUDIO_BETA_KEYSTORE_B64: ${{ secrets.STUDIO_BETA_KEYSTORE_B64 }}
        run: python3 android/scripts/restore-beta-signing.py
      - name: Client unit checks, lint and real ARM package
        if: ${{ !inputs.reuse_application_build }}
        run: |
          test ! -f android/keystore.properties
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0'
          bash android/gradlew -p android --no-daemon :app:testDebugUnitTest
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PbetaVersionCode=3000029 -PbetaVersionName=3.0.0-alpha.24-beta.5 :app:lintNetworkBeta :app:assembleNetworkBeta :app:assembleNetworkBetaAndroidTest
          python3 android/scripts/package-network-preview.py
          python3 android/scripts/check-environment-package.py
          mkdir -p android/app/build/environment-client-input
          cp -R android/app/build/network-beta/. android/app/build/environment-client-input/
          cp android/app/build/outputs/apk/androidTest/networkBeta/app-networkBeta-androidTest.apk android/app/build/environment-client-input/upgrade-test.apk
      - name: Build x86 compatibility and separately marked synthetic target
        if: ${{ !inputs.reuse_application_build }}
        run: |
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PbetaAbi=x86_64 -PbetaVersionCode=3000029 -PbetaVersionName=3.0.0-alpha.24-beta.5 :app:assembleNetworkBeta
          cp android/app/build/outputs/apk/networkBeta/app-networkBeta.apk android/app/build/environment-client-input/human-x86.apk
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PenvironmentTest -PbetaAbi=x86_64 -PbetaVersionCode=3000029 -PbetaVersionName=3.0.0-alpha.24-beta.5 :app:assembleNetworkBeta
          cp android/app/build/outputs/apk/networkBeta/app-networkBeta.apk android/app/build/environment-client-input/synthetic-x86.apk
      - name: Authenticate reusable application source and completed build checks
        if: inputs.reuse_application_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/42034191686 --jq .head_sha)" = f092bf88d3b4efa9104276f03d3aa17cc438bb5e
          test "$(gh api repos/${{ github.repository }}/actions/runs/42034191686/jobs --jq '.jobs[]|select(.name=="build")|.conclusion')" = success
          git fetch origin f092bf88d3b4efa9104276f03d3aa17cc438bb5e --depth=1
          git diff --exit-code f092bf88d3b4efa9104276f03d3aa17cc438bb5e HEAD -- android/app android/settings.gradle android/build.gradle android/network-poc/corebridge android/scripts/environment_upgrade.py
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.reuse_application_build }}
        with:
          name: environment-client-input
          retention-days: 14
          path: android/app/build/environment-client-input/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.reuse_application_build }}
        with:
          name: environment-client-build-evidence
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - name: Remove transient signer
        if: always()
        run: rm -f "$RUNNER_TEMP/studio-beta.p12"
  accept:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.reuse_application_build && '[{"api":28,"target":"synthetic"},{"api":35,"target":"synthetic"}]' || '[{"api":28,"target":"human"},{"api":35,"target":"human"},{"api":28,"target":"synthetic"},{"api":35,"target":"synthetic"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare isolated verification tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          if [ '${{ matrix.target }}' = synthetic ]; then sudo apt-get update -qq; sudo apt-get install -y libnss3-tools; fi
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: ${{ inputs.reuse_application_build && 42034191686 || github.run_id }}
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-input
      - uses: actions/download-artifact@v4
        if: matrix.api == 35
        with:
          name: ChatGPT-Studio-Beta4-Live-Network-Candidate
          run-id: 42005371710
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-baseline
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: network-panel-input
          run-id: 42003462509
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-ci-baseline
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: beta-continuation-input
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/environment-provider-input
      - name: Compile the existing Android9 trusted-touch helper outside the APK
        if: matrix.api == 28 && matrix.target == 'synthetic'
        run: |
          mkdir -p android/app/build/environment-touch/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system -memory 3072
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/app/build/environment-provider-input/provider --output android/app/build/environment-client-evidence/provider; fi
            if [ '${{ matrix.api }}' = 28 ] && [ '${{ matrix.target }}' = synthetic ]; then adb push android/app/build/environment-touch/input.jar /data/local/tmp/studio-poc-input.jar; fi
            if [ '${{ matrix.target }}' = human ]; then python3 android/scripts/environment_upgrade.py --target human; else python3 android/scripts/run-environment-client.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-client-${{ matrix.api }}-${{ matrix.target }}
          retention-days: 14
          path: android/app/build/environment-client-evidence/
  reuse-human:
    if: inputs.reuse_application_build
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [28,35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-${{ matrix.api }}-human
          run-id: 42034191686
          github-token: ${{ github.token }}
          path: evidence
      - name: Require the existing human upgrade proof, without rewriting its source identity
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/verified-human.json');r=json.loads(p.read_text())
          assert r['complete'] and r['api']==${{ matrix.api }}
          if r['api']==35: assert r['originalHumanCandidateBytesInstalled']
          pathlib.Path('evidence/reused-human-source.json').write_text(json.dumps({'run':42034191686,'sourceSHA':r['sourceSHA'],'inputUnchanged':True})+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: environment-client-${{ matrix.api }}-human
          retention-days: 14
          path: evidence/
  deliver:
    needs: [accept, reuse-human]
    if: ${{ always() && needs.accept.result == 'success' && (needs.reuse-human.result == 'success' || needs.reuse-human.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: ${{ inputs.reuse_application_build && 42034191686 || github.run_id }}
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          pattern: environment-client-*-human
          path: acceptance/human
      - uses: actions/download-artifact@v4
        with:
          pattern: environment-client-*-synthetic
          path: acceptance/synthetic
      - name: Gate usable client on upgrades and real environment/recovery evidence
        run: python3 android/scripts/deliver-environment-client.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Studio-Beta5-Account-Environments-Candidate
          retention-days: 14
          path: candidate/
