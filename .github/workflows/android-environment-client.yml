name: Android Environment Client Candidate
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/android-environment-client.yml']
  workflow_dispatch:
    inputs:
      run_acceptance:
        description: Run the specifically approved synthetic browser acceptance; false builds and checks packages only
        type: boolean
        default: false
      reuse_gecko_acceptance:
        description: Reuse the complete six-case Gecko matrix from 42164399330 when its APK and network fixtures are unchanged
        type: boolean
        default: false
      reuse_beta7_checks:
        description: Reuse immutable Beta7 build and complete client regressions from 42151389890 for network-fixture-only fixes
        type: boolean
        default: false
      reuse_application_build:
        description: Reuse immutable Beta7 APKs and human upgrades from 42161704887
        type: boolean
        default: false
      reuse_android9_acceptance:
        description: Reuse complete API28 proof from 42164399330 for the identical application and test bytes
        type: boolean
        default: false
      rebuild_api35_acceptance_test:
        description: Compile only the API35 test fixture while keeping the verified application APKs immutable
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    env:
      STUDIO_BETA_STORE_PASSWORD: ${{ secrets.STUDIO_BETA_STORE_PASSWORD }}
      STUDIO_BETA_MODE: '1'
      BETA_VERSION_CODE: '3000032'
    steps:
      - uses: actions/checkout@v4
      - name: Freeze one Shanghai timestamp for every candidate package
        id: version
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        run: |
          python3 android/scripts/android_version.py create --output android/app/build/android-version.json
          echo "STUDIO_ANDROID_VERSION_FILE=$GITHUB_WORKSPACE/android/app/build/android-version.json" >> "$GITHUB_ENV"
          echo "version_name=$(python3 android/scripts/android_version.py read --file android/app/build/android-version.json --field versionName)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(python3 android/scripts/android_version.py read --file android/app/build/android-version.json --field versionCode)" >> "$GITHUB_OUTPUT"
      - name: Require immutable application reuse for the completed Android9 proof
        if: inputs.reuse_android9_acceptance
        run: test '${{ inputs.reuse_application_build }}' = true
      - name: Require the completed Android9 scope for an API35-only fixture rebuild
        if: inputs.rebuild_api35_acceptance_test
        run: |
          test '${{ inputs.reuse_application_build }}' = true
          test '${{ inputs.reuse_android9_acceptance }}' = true
      - uses: actions/setup-java@v4
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
            android/app/libs/licenses/
          key: formal-network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/go.sum', 'android/network-poc/corebridge/networkcore.go', 'android/network-poc/scripts/build-core.sh', 'android/scripts/prepare-network-core.sh') }}
      - run: bash android/scripts/prepare-network-core.sh
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
      - name: Prepare the owned network trust and node inputs
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        run: |
          python3 -m unittest discover -s android/network-poc/scripts/tests -p test_secure_fixture.py
          python3 android/network-poc/scripts/fixture.py --prepare-only --output android/network-poc/secure-fixture
      - name: Restore existing fixed Beta signer
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        env:
          STUDIO_BETA_KEYSTORE_B64: ${{ secrets.STUDIO_BETA_KEYSTORE_B64 }}
        run: python3 android/scripts/restore-beta-signing.py
      - name: Client unit checks, lint and real ARM package
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        run: |
          test ! -f android/keystore.properties
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0'
          bash android/gradlew -p android --no-daemon :app:testDebugUnitTest
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient :app:lintNetworkBeta :app:assembleNetworkBeta :app:assembleNetworkBetaAndroidTest
          python3 android/scripts/package-network-preview.py
          python3 android/scripts/check-environment-package.py
          mkdir -p android/app/build/environment-client-input
          cp -R android/app/build/network-beta/. android/app/build/environment-client-input/
          cp android/app/build/outputs/apk/androidTest/networkBeta/app-networkBeta-androidTest.apk android/app/build/environment-client-input/upgrade-test.apk
      - name: Build x86 compatibility and separately marked synthetic target
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        run: |
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PbetaAbi=x86_64 :app:assembleNetworkBeta
          cp android/app/build/outputs/apk/networkBeta/app-networkBeta.apk android/app/build/environment-client-input/human-x86.apk
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PenvironmentTest -PbetaAbi=x86_64 :app:assembleNetworkBeta
          cp android/app/build/outputs/apk/networkBeta/app-networkBeta.apk android/app/build/environment-client-input/synthetic-x86.apk
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PenvironmentTest -PenvironmentNetworkTest -PbetaAbi=x86_64 :app:assembleNetworkBeta
          cp android/app/build/outputs/apk/networkBeta/app-networkBeta.apk android/app/build/environment-client-input/gecko-network-x86.apk
          python3 android/scripts/gecko-network-package.py
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          name: gecko-network-fixture
          retention-days: 1
          path: android/network-poc/secure-fixture/
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          name: gecko-network-host-core
          retention-days: 14
          path: android/network-poc/corebridge/bin/xray
      - name: Authenticate immutable Beta7 APKs and completed client checks
        if: inputs.reuse_beta7_checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ inputs.reuse_application_build }}' != true
          test '${{ inputs.reuse_android9_acceptance }}' != true
          test '${{ inputs.rebuild_api35_acceptance_test }}' != true
          test "$(gh api repos/${{ github.repository }}/actions/runs/42151389890 --jq .head_sha)" = 407bca267f2bf12a7af0b5aaa3f13b8b46424c7c
          gh api repos/${{ github.repository }}/actions/runs/42151389890/jobs --paginate --jq '.jobs[]|select(.name=="build" or (.name|startswith("accept (")))|[.name,.conclusion]|@tsv' > "$RUNNER_TEMP/beta7-checks.tsv"
          python3 - <<'PY_CHECK'
          import os,pathlib
          rows=dict(line.split('\t') for line in pathlib.Path(os.environ['RUNNER_TEMP'],'beta7-checks.tsv').read_text().splitlines())
          expected={'build',*(f'accept ({api}, {target})' for api in (28,35) for target in ('human','synthetic'))}
          assert set(rows)==expected and all(value=='success' for value in rows.values()),rows
          PY_CHECK
          git fetch origin 407bca267f2bf12a7af0b5aaa3f13b8b46424c7c --depth=1
          git diff --exit-code 407bca267f2bf12a7af0b5aaa3f13b8b46424c7c HEAD -- android/app android/settings.gradle android/build.gradle android/gradle android/environment-poc/gradle android/network-poc/corebridge android/network-poc/scripts/build-core.sh android/scripts/prepare-network-core.sh android/scripts/environment_upgrade.py android/scripts/run-environment-client.py android/scripts/environment-fixture.py android/scripts/android desktop/resources/capabilities
          python3 -m unittest discover -s android/network-poc/scripts/tests -p test_secure_fixture.py
      - name: Authenticate reusable application source and completed build checks
        if: inputs.reuse_application_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/42161704887 --jq .head_sha)" = 1f32390332b2d510f561db241f47068a34568a1e
          test "$(gh api repos/${{ github.repository }}/actions/runs/42161704887/jobs --jq '.jobs[]|select(.name=="build")|.conclusion')" = success
          git fetch origin 1f32390332b2d510f561db241f47068a34568a1e --depth=1
          if [ '${{ inputs.rebuild_api35_acceptance_test }}' = true ]; then
            git diff --exit-code 1f32390332b2d510f561db241f47068a34568a1e HEAD -- android/app ':(exclude)android/app/src/environmentTest/java/com/forcemind/chatgpt/profiles/BrowserChromeNavigationTest.java' android/settings.gradle android/build.gradle android/network-poc/corebridge
          else
            git diff --exit-code 1f32390332b2d510f561db241f47068a34568a1e HEAD -- android/app android/settings.gradle android/build.gradle android/network-poc/corebridge android/scripts/environment_upgrade.py
          fi
          git diff --exit-code 1f32390332b2d510f561db241f47068a34568a1e HEAD -- android/scripts/android/AsciiInput.java android/scripts/android/TouchInput.java android/network-poc/scripts/fixture.py android/network-poc/scripts/gecko_fixture_page.py desktop/resources/capabilities
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          name: environment-client-input
          retention-days: 14
          path: android/app/build/environment-client-input/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
        with:
          name: environment-client-build-evidence
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - name: Remove transient signer
        if: always()
        run: rm -f "$RUNNER_TEMP/studio-beta.p12"
  api35-test-build:
    if: inputs.rebuild_api35_acceptance_test && inputs.reuse_application_build && inputs.reuse_android9_acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDIO_BETA_STORE_PASSWORD: ${{ secrets.STUDIO_BETA_STORE_PASSWORD }}
      STUDIO_BETA_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
            android/app/libs/licenses/
          key: formal-network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/go.sum', 'android/network-poc/corebridge/networkcore.go', 'android/network-poc/scripts/build-core.sh', 'android/scripts/prepare-network-core.sh') }}
      - run: bash android/scripts/prepare-network-core.sh
      - name: Restore the existing test signer
        env:
          STUDIO_BETA_KEYSTORE_B64: ${{ secrets.STUDIO_BETA_KEYSTORE_B64 }}
        run: python3 android/scripts/restore-beta-signing.py
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: 42161704887
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-input
      - name: Preserve the original App timestamp for a test-only rebuild
        run: |
          python3 android/scripts/android_version.py from-receipt --receipt android/app/build/environment-client-input/receipt.json --output android/app/build/android-version.json
          echo "STUDIO_ANDROID_VERSION_FILE=$GITHUB_WORKSPACE/android/app/build/android-version.json" >> "$GITHUB_ENV"
      - name: Compile the acceptance APK without repackaging the frozen application
        run: |
          test ! -f android/keystore.properties
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0'
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient :app:assembleNetworkBetaAndroidTest
          mkdir -p android/app/build/api35-acceptance-test
          cp android/app/build/outputs/apk/androidTest/networkBeta/app-networkBeta-androidTest.apk android/app/build/api35-acceptance-test/api35-upgrade-test.apk
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          import sys
          sys.path.insert(0,'android/scripts')
          from android_version import load_version
          root=pathlib.Path('android/app/build/api35-acceptance-test');apk=root/'api35-upgrade-test.apk'
          cert=subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/35.0.0/apksigner','verify','--print-certs',str(apk)],text=True)
          signer=re.search(r'certificate SHA-256 digest: ([0-9a-fA-F]+)',cert)[1].lower()
          assert signer==json.loads(pathlib.Path('docs/signing/android-network-beta.json').read_text())['certificateSHA256']
          receipt={'file':apk.name,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'sourceSHA':os.environ['GITHUB_SHA'],'applicationSourceSHA':'1f32390332b2d510f561db241f47068a34568a1e','targetVersionCode':load_version()['versionCode'],'versionMetadata':load_version(),'targetPackage':'com.forcemind.chatgpt.profiles.networkbeta','signerSHA256':signer}
          (root/'api35-test-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: api35-acceptance-test
          retention-days: 14
          path: android/app/build/api35-acceptance-test/
      - name: Remove the transient signer
        if: always()
        run: rm -f "$RUNNER_TEMP/studio-beta.p12"
  accept:
    needs: [build, api35-test-build]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_acceptance && !inputs.reuse_beta7_checks && needs.build.result == 'success' && (needs.api35-test-build.result == 'success' || needs.api35-test-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.reuse_application_build && (inputs.reuse_android9_acceptance && '[{"api":35,"target":"synthetic"}]' || '[{"api":28,"target":"synthetic"},{"api":35,"target":"synthetic"}]') || '[{"api":28,"target":"human"},{"api":35,"target":"human"},{"api":28,"target":"synthetic"},{"api":35,"target":"synthetic"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare isolated verification tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          if [ '${{ matrix.target }}' = synthetic ]; then sudo apt-get update -qq; sudo apt-get install -y libnss3-tools; fi
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: ${{ inputs.reuse_application_build && 42161704887 || github.run_id }}
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-input
      - uses: actions/download-artifact@v4
        if: inputs.rebuild_api35_acceptance_test && matrix.api == 35
        with:
          name: api35-acceptance-test
          path: android/app/build/environment-client-input
      - uses: actions/download-artifact@v4
        if: matrix.api == 35
        with:
          name: ChatGPT-Studio-Beta7-Gecko-Network-Candidate
          run-id: 42170066469
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-baseline
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: environment-client-input
          run-id: 42161704887
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-ci-baseline
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: beta-continuation-input
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/environment-provider-input
      - name: Compile the existing Android9 trusted-touch helper outside the APK
        if: matrix.api == 28 && matrix.target == 'synthetic'
        run: |
          mkdir -p android/app/build/environment-touch/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
      - name: Compile the single-batch native ASCII input helper outside the APK
        if: matrix.target == 'synthetic'
        run: |
          mkdir -p android/app/build/environment-ascii/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-ascii/classes android/scripts/android/AsciiInput.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-ascii/input.jar android/app/build/environment-ascii/classes/com/forcemind/chatgpt/pocinput/AsciiInput.class
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.api != 35
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu ${{ matrix.api == 35 && 'swiftshader' || 'swiftshader_indirect' }}
            -writable-system -memory ${{ matrix.api == 35 && 4096 || 3072 }}
            ${{ matrix.api == 35 && '-feature -Vulkan' || '' }}
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/app/build/environment-provider-input/provider --output android/app/build/environment-client-evidence/provider; fi
            if [ '${{ matrix.api }}' = 28 ] && [ '${{ matrix.target }}' = synthetic ]; then adb push android/app/build/environment-touch/input.jar /data/local/tmp/studio-poc-input.jar; fi
            if [ '${{ matrix.target }}' = synthetic ]; then adb push android/app/build/environment-ascii/input.jar /data/local/tmp/studio-poc-ascii-input.jar; fi
            if [ '${{ matrix.target }}' = human ]; then python3 android/scripts/environment_upgrade.py --target human; else python3 android/scripts/run-environment-client.py; fi
      - name: Boot Android15 without an early Launcher key event
        if: matrix.api == 35 && matrix.target == 'synthetic'
        run: bash android/scripts/run-environment-api35.sh
      - name: Boot Android15 for the human upgrade check
        if: matrix.api == 35 && matrix.target == 'human'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan -writable-system -memory 4096
          script: python3 android/scripts/environment_upgrade.py --target human
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-client-${{ matrix.api }}-${{ matrix.target }}
          retention-days: 14
          path: android/app/build/environment-client-evidence/
  gecko-network:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_acceptance && !inputs.reuse_gecko_acceptance }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28,35]
        transport: [raw,tls,reality]
    env:
      STUDIO_GECKO_APPLICATION_SHA: ${{ inputs.reuse_beta7_checks && '407bca267f2bf12a7af0b5aaa3f13b8b46424c7c' || (inputs.reuse_application_build && '1f32390332b2d510f561db241f47068a34568a1e' || github.sha) }}
      STUDIO_GECKO_TRANSPORT: ${{ matrix.transport }}
      STUDIO_GECKO_FIXTURE: android/network-poc/secure-fixture/fixture.json
      STUDIO_GECKO_APK: android/app/build/environment-client-input/gecko-network-x86.apk
      STUDIO_GECKO_RECEIPT: android/app/build/environment-client-input/gecko-network-receipt.json
      STUDIO_GECKO_OUTPUT: android/app/build/gecko-network-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: ${{ inputs.reuse_beta7_checks && 42151389890 || (inputs.reuse_application_build && 42161704887 || github.run_id) }}
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-input
      - uses: actions/download-artifact@v4
        with:
          name: gecko-network-fixture
          run-id: ${{ inputs.reuse_beta7_checks && 42151389890 || (inputs.reuse_application_build && 42161704887 || github.run_id) }}
          github-token: ${{ github.token }}
          path: android/network-poc/secure-fixture
      - uses: actions/download-artifact@v4
        with:
          name: gecko-network-host-core
          run-id: ${{ inputs.reuse_beta7_checks && 42151389890 || (inputs.reuse_application_build && 42161704887 || github.run_id) }}
          github-token: ${{ github.token }}
          path: android/network-poc/corebridge/bin
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: beta-continuation-input
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/environment-provider-input
      - name: Start the existing synthetic VLESS nodes and owned origin
        run: |
          mkdir -p "$STUDIO_GECKO_OUTPUT"
          chmod +x android/network-poc/corebridge/bin/xray
          python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture --gecko-network > "$STUDIO_GECKO_OUTPUT/host-fixture.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if [ -f android/network-poc/secure-fixture/ready.json ]; then break; fi
            sleep 1
          done
          test -f android/network-poc/secure-fixture/ready.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Compile the existing native input helper outside the app
        run: |
          mkdir -p android/app/build/environment-ascii/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-ascii/classes android/scripts/android/AsciiInput.java android/scripts/android/AsciiInputStream.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-ascii/input.jar android/app/build/environment-ascii/classes/com/forcemind/chatgpt/pocinput/*.class
      - name: Compile the existing Android9 touch helper
        if: matrix.api == 28
        run: |
          mkdir -p android/app/build/environment-touch/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.api == 28
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system -memory 3072
          script: |
            python3 android/network-poc/scripts/install-webview.py --provider android/app/build/environment-provider-input/provider --output android/app/build/gecko-network-evidence/provider
            adb push android/app/build/environment-ascii/input.jar /data/local/tmp/studio-poc-ascii-input.jar
            adb push android/app/build/environment-touch/input.jar /data/local/tmp/studio-poc-input.jar
            python3 android/scripts/run-gecko-network.py
      - name: Run the same approved network scenarios on ready Android15
        if: matrix.api == 35
        run: bash android/scripts/run-environment-api35.sh android/scripts/run-gecko-network.py
      - name: Preserve owned node process logs even after the first error
        if: always()
        run: |
          mkdir -p "$STUDIO_GECKO_OUTPUT/node-logs"
          if compgen -G 'android/network-poc/secure-fixture/fixture-*.log' > /dev/null; then
            cp android/network-poc/secure-fixture/fixture-*.log "$STUDIO_GECKO_OUTPUT/node-logs/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-network-${{ matrix.api }}-${{ matrix.transport }}
          retention-days: 14
          path: android/app/build/gecko-network-evidence/
  gecko-local-exports:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_acceptance && !inputs.reuse_application_build && !inputs.reuse_beta7_checks }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28,35]
    env:
      STUDIO_GECKO_APPLICATION_SHA: ${{ github.sha }}
      STUDIO_GECKO_FIXTURE: android/network-poc/secure-fixture/fixture.json
      STUDIO_GECKO_APK: android/app/build/environment-client-input/gecko-network-x86.apk
      STUDIO_GECKO_RECEIPT: android/app/build/environment-client-input/gecko-network-receipt.json
      STUDIO_GECKO_OUTPUT: android/app/build/gecko-local-exports-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: android/app/build/environment-client-input
      - uses: actions/download-artifact@v4
        with:
          name: gecko-network-fixture
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: android/network-poc/secure-fixture
      - uses: actions/download-artifact@v4
        with:
          name: gecko-network-host-core
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: android/network-poc/corebridge/bin
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: beta-continuation-input
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/environment-provider-input
      - name: Start owned local-export Blob and data fixtures
        run: |
          mkdir -p "$STUDIO_GECKO_OUTPUT"
          chmod +x android/network-poc/corebridge/bin/xray
          python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture --gecko-local-exports > "$STUDIO_GECKO_OUTPUT/host-fixture.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if [ -f android/network-poc/secure-fixture/ready.json ]; then break; fi
            sleep 1
          done
          test -f android/network-poc/secure-fixture/ready.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Compile the existing native input helper outside the app
        run: |
          mkdir -p android/app/build/environment-ascii/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-ascii/classes android/scripts/android/AsciiInput.java android/scripts/android/AsciiInputStream.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-ascii/input.jar android/app/build/environment-ascii/classes/com/forcemind/chatgpt/pocinput/*.class
      - name: Compile the existing Android9 touch helper
        if: matrix.api == 28
        run: |
          mkdir -p android/app/build/environment-touch/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.api == 28
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system -memory 3072
          script: |
            python3 android/network-poc/scripts/install-webview.py --provider android/app/build/environment-provider-input/provider --output android/app/build/gecko-local-exports-evidence/provider
            adb push android/app/build/environment-ascii/input.jar /data/local/tmp/studio-poc-ascii-input.jar
            adb push android/app/build/environment-touch/input.jar /data/local/tmp/studio-poc-input.jar
            python3 android/scripts/run-gecko-local-exports.py
      - name: Run the approved local-export scenarios on ready Android15
        if: matrix.api == 35
        run: bash android/scripts/run-environment-api35.sh android/scripts/run-gecko-local-exports.py
      - name: Preserve owned node process logs even after the first error
        if: always()
        run: |
          mkdir -p "$STUDIO_GECKO_OUTPUT/node-logs"
          if compgen -G 'android/network-poc/secure-fixture/fixture-*.log' > /dev/null; then
            cp android/network-poc/secure-fixture/fixture-*.log "$STUDIO_GECKO_OUTPUT/node-logs/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-local-exports-${{ matrix.api }}
          retention-days: 14
          path: android/app/build/gecko-local-exports-evidence/
  reuse-human:
    if: inputs.run_acceptance && inputs.reuse_application_build
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [28,35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-${{ matrix.api }}-human
          run-id: 42161704887
          github-token: ${{ github.token }}
          path: evidence
      - name: Require the existing human upgrade proof, without rewriting its source identity
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/verified-human.json');r=json.loads(p.read_text())
          assert r['complete'] and r['api']==${{ matrix.api }} and r['sourceSHA']=='1f32390332b2d510f561db241f47068a34568a1e'
          if r['api']==35: assert r['originalHumanCandidateBytesInstalled']
          pathlib.Path('evidence/reused-human-source.json').write_text(json.dumps({'run':42161704887,'sourceSHA':r['sourceSHA'],'inputUnchanged':True})+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: environment-client-${{ matrix.api }}-human
          retention-days: 14
          path: evidence/
  reuse-android9:
    if: inputs.run_acceptance && inputs.reuse_application_build && inputs.reuse_android9_acceptance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-28-synthetic
          run-id: 42164399330
          github-token: ${{ github.token }}
          path: evidence
      - name: Authenticate the complete Android9 proof and its unchanged fixture inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin 493464bc58e1ec2414fc25535fc9d856620d645c --depth=1
          git diff --exit-code 493464bc58e1ec2414fc25535fc9d856620d645c HEAD -- android/scripts/environment-fixture.py android/scripts/android/AsciiInput.java android/scripts/android/TouchInput.java android/scripts/run-environment-client.py android/scripts/environment_upgrade.py
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('evidence/functional.json').read_text())
          assert r['complete'] and r['api']==28 and r['sourceSHA']=='493464bc58e1ec2414fc25535fc9d856620d645c'
          assert r['candidateInstalledSHA256']=='8c5c2a1bd6a4c3f3fb2dad01333cd777d753be565a69c99a895e80ba95472462'
          assert r['legacyUpgrade']['testAPK']['sha256']=='47112aff4feb3330dcb1870613d6363a3798175ff26c1382e0aaf90bf05ffa79'
          assert r['legacyUpgrade']['humanCandidateSHA256']=='361c4b7120a62f5da632fd4a8d86db937a94741043a80f84e9522eb2dd883173'
          assert r['legacyChromeNavigation']['complete'] and r['geckoChromeNavigation']['complete'] and r['legacyAfterEnvironmentUse']['complete']
          pathlib.Path('evidence/reused-android9-source.json').write_text(json.dumps({'run':42164399330,'sourceSHA':r['sourceSHA'],'applicationAndTestBytesUnchanged':True,'api35OnlyDriverPreconditionChange':True})+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: environment-client-28-synthetic
          retention-days: 14
          path: evidence/
  reuse-beta7:
    if: inputs.run_acceptance && inputs.reuse_beta7_checks
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [28,35]
        target: [human,synthetic]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-${{ matrix.api }}-${{ matrix.target }}
          run-id: 42151389890
          github-token: ${{ github.token }}
          path: evidence
      - name: Keep complete proofs and original source identity unchanged
        run: |
          python3 - <<'PY_PROOF'
          import json,pathlib
          name='verified-human.json' if '${{ matrix.target }}'=='human' else 'functional.json'
          r=json.loads(pathlib.Path('evidence',name).read_text())
          assert r['complete'] and r['api']==${{ matrix.api }}
          assert r['sourceSHA']=='407bca267f2bf12a7af0b5aaa3f13b8b46424c7c'
          pathlib.Path('evidence/reused-beta7-source.json').write_text(json.dumps({'run':42151389890,'sourceSHA':r['sourceSHA'],'applicationAndAcceptanceInputsUnchanged':True})+'\n')
          PY_PROOF
      - uses: actions/upload-artifact@v4
        with:
          name: environment-client-${{ matrix.api }}-${{ matrix.target }}
          retention-days: 14
          path: evidence/
  reuse-gecko:
    if: inputs.run_acceptance && inputs.reuse_gecko_acceptance
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api: [28,35]
        transport: [raw,tls,reality]
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate the complete matrix and unchanged network inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ inputs.reuse_application_build }}' = true
          test "$(gh api repos/${{ github.repository }}/actions/runs/42164399330 --jq .head_sha)" = 493464bc58e1ec2414fc25535fc9d856620d645c
          test "$(gh api repos/${{ github.repository }}/actions/runs/42164399330/jobs --jq '.jobs[]|select(.name=="gecko-network (${{ matrix.api }}, ${{ matrix.transport }})")|.conclusion')" = success
          git fetch origin 493464bc58e1ec2414fc25535fc9d856620d645c --depth=1
          git diff --exit-code 493464bc58e1ec2414fc25535fc9d856620d645c HEAD -- android/app ':(exclude)android/app/src/environmentTest/**' android/scripts/run-gecko-network.py android/scripts/android android/network-poc/scripts/fixture.py android/network-poc/scripts/gecko_fixture_page.py android/scripts/run-environment-api35.sh
      - uses: actions/download-artifact@v4
        with:
          name: gecko-network-${{ matrix.api }}-${{ matrix.transport }}
          run-id: 42164399330
          github-token: ${{ github.token }}
          path: evidence
      - name: Keep the original successful network proof unchanged
        run: |
          python3 - <<'PY_NETWORK'
          import json,pathlib
          p=json.loads(pathlib.Path('evidence/gecko-network.json').read_text())
          assert p['complete'] and p['api']==${{ matrix.api }} and p['transport']=='${{ matrix.transport }}'
          assert p['sourceSHA']=='493464bc58e1ec2414fc25535fc9d856620d645c'
          assert p['applicationSourceSHA']=='1f32390332b2d510f561db241f47068a34568a1e'
          assert p['candidateInstalledSHA256']=='5d0f4b76168a2af4ef48ef5511e901d82d66c995a4e6eb48dc89b36dcaa93d38'
          pathlib.Path('evidence/reused-network-source.json').write_text(json.dumps({'run':42164399330,'sourceSHA':p['sourceSHA'],'apkAndNetworkInputsUnchanged':True})+'\n')
          PY_NETWORK
      - uses: actions/upload-artifact@v4
        with:
          name: gecko-network-${{ matrix.api }}-${{ matrix.transport }}
          retention-days: 14
          path: evidence/
  deliver:
    needs: [build, accept, gecko-network, gecko-local-exports, reuse-human, reuse-android9, reuse-beta7, reuse-gecko]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_acceptance && (needs.accept.result == 'success' || needs.reuse-beta7.result == 'success') && (needs.gecko-network.result == 'success' || needs.reuse-gecko.result == 'success') && needs.gecko-local-exports.result == 'success' && (needs.reuse-human.result == 'success' || needs.reuse-human.result == 'skipped') && (needs.reuse-android9.result == 'success' || needs.reuse-android9.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: environment-client-input
          run-id: ${{ inputs.reuse_beta7_checks && 42151389890 || (inputs.reuse_application_build && 42161704887 || github.run_id) }}
          github-token: ${{ github.token }}
          path: input
      - uses: actions/download-artifact@v4
        if: inputs.rebuild_api35_acceptance_test
        with:
          name: api35-acceptance-test
          path: input
      - uses: actions/download-artifact@v4
        with:
          pattern: environment-client-*-human
          path: acceptance/human
      - uses: actions/download-artifact@v4
        with:
          pattern: environment-client-*-synthetic
          path: acceptance/synthetic
      - name: Gate usable client on upgrades and real environment/recovery evidence
        run: python3 android/scripts/deliver-environment-client.py
      - uses: actions/download-artifact@v4
        with:
          pattern: gecko-network-??-*
          path: acceptance/network
      - uses: actions/download-artifact@v4
        with:
          pattern: gecko-local-exports-??
          path: acceptance/local-exports
      - name: Require real Gecko route and file-byte evidence from every protocol
        run: python3 android/scripts/deliver-gecko-network.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Studio-Android-${{ needs.build.outputs.version_name }}-Candidate
          retention-days: 14
          path: candidate/
