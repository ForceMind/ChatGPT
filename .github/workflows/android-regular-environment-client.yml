name: Android Regular Environment Compatibility Review
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/android-regular-environment-client.yml']
  workflow_dispatch:
    inputs:
      validation_suite:
        type: choice
        default: compatibility
        options: [compatibility, navigation]
        description: Approved regular-package suite
permissions:
  contents: read
  actions: read
env:
  STUDIO_REGULAR_VALIDATION_SCRIPT: ${{ inputs.validation_suite == 'navigation' && 'android/scripts/run-regular-navigation.py' || 'android/scripts/run-regular-environment-client.py' }}
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
            android/app/libs/licenses/
          key: formal-network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/go.sum', 'android/network-poc/corebridge/**/*.go', 'android/network-poc/scripts/build-core.sh', 'android/scripts/prepare-network-core.sh') }}
      - run: bash android/scripts/prepare-network-core.sh
      - name: Check ordinary debug before selecting regular metadata
        run: |
          test ! -f android/keystore.properties
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0'
          bash android/gradlew -p android --no-daemon :app:testDebugUnitTest
      - name: Freeze one Shanghai timestamp for human and CI packages
        id: version
        run: |
          python3 android/scripts/regular_version.py create --output android/app/build/regular-android-version.json
          echo "STUDIO_ANDROID_VERSION_FILE=$GITHUB_WORKSPACE/android/app/build/regular-android-version.json" >> "$GITHUB_ENV"
          echo "version_name=$(python3 android/scripts/regular_version.py read --file android/app/build/regular-android-version.json --field versionName)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(python3 android/scripts/regular_version.py read --file android/app/build/regular-android-version.json --field versionCode)" >> "$GITHUB_OUTPUT"
      - name: Build and inspect unsigned original-package arm64 review
        run: |
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PregularEnvironmentClient -PunsignedRelease :app:lintRelease :app:assembleRelease
          python3 android/scripts/package-regular-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: regular-unsigned-review
          retention-days: 14
          if-no-files-found: error
          path: android/app/build/regular-review/
      - name: Create a temporary compatibility signer in runner storage
        run: |
          python3 - <<'PY'
          import os, pathlib, secrets
          password = secrets.token_hex(32)
          print('::add-mask::' + password)
          key = pathlib.Path(os.environ['RUNNER_TEMP'], 'studio-regular-ci.p12')
          assert not key.exists()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('STUDIO_REGULAR_CI_KEYSTORE_PATH=' + str(key) + '\n')
              env.write('STUDIO_REGULAR_CI_STORE_PASSWORD=' + password + '\n')
          PY
      - name: Generate the one-run PKCS12 certificate
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$STUDIO_REGULAR_CI_KEYSTORE_PATH" -storepass:env STUDIO_REGULAR_CI_STORE_PASSWORD -keypass:env STUDIO_REGULAR_CI_STORE_PASSWORD -alias regular-compat-ci -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=Temporary regular compatibility CI'
          chmod 600 "$STUDIO_REGULAR_CI_KEYSTORE_PATH"
      - name: Authenticate original public alpha22 and change signing metadata only
        run: |
          mkdir -p android/app/build/regular-environment-input
          curl --fail --location --retry 3 --output android/app/build/regular-environment-input/alpha22-public.apk https://github.com/ForceMind/ChatGPT/releases/download/v3.0.0-alpha.22/ChatGPT-Studio-3.0.0-alpha.22-android.apk
          python3 - <<'PY'
          import hashlib, pathlib
          apk = pathlib.Path('android/app/build/regular-environment-input/alpha22-public.apk')
          assert apk.stat().st_size == 7376521
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == '39a06004608162884c5d2a11277eee840f5311438376bd7541adc638b1e55e53'
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$STUDIO_REGULAR_CI_KEYSTORE_PATH" --ks-key-alias regular-compat-ci --ks-pass env:STUDIO_REGULAR_CI_STORE_PASSWORD --key-pass env:STUDIO_REGULAR_CI_STORE_PASSWORD --out android/app/build/regular-environment-input/alpha22-ci-resigned.apk android/app/build/regular-environment-input/alpha22-public.apk
      - name: Build separately marked temporary-key x86 compatibility inputs
        run: |
          studio_navigation_args=()
          if [ "${{ inputs.validation_suite }}" = navigation ]; then studio_navigation_args+=(-PregularNavigationTest); fi
          bash android/environment-poc/gradlew -p android --no-daemon -PenvironmentClient -PregularEnvironmentClient -PregularEnvironmentCi -PenvironmentTest "${studio_navigation_args[@]}" :app:assembleRelease :app:assembleReleaseAndroidTest
          python3 android/scripts/prepare-regular-ci-inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: regular-environment-ci-input
          retention-days: 14
          if-no-files-found: error
          path: android/app/build/regular-environment-input/
      - name: Remove the one-run signer
        if: always()
        run: rm -f "$RUNNER_TEMP/studio-regular-ci.p12"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regular-environment-build-evidence
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/test-results/
  accept:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare the existing fixture tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - uses: actions/download-artifact@v4
        with:
          name: regular-environment-ci-input
          path: android/app/build/regular-environment-input
      - name: Select the explicit temporary certificate from its receipt
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          value = json.loads(pathlib.Path('android/app/build/regular-environment-input/receipt.json').read_text())
          signer = value['signerSHA256']
          assert value['ciOnly'] is True and value['sourceSHA'] == os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[a-f0-9]{64}', signer)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('STUDIO_REGULAR_CI_CERT_SHA256=' + signer + '\n')
          PY
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: beta-continuation-input
          run-id: 41993581770
          github-token: ${{ github.token }}
          path: android/app/build/environment-provider-input
      - name: Compile the existing native ASCII helper outside the APK
        run: |
          mkdir -p android/app/build/environment-ascii/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-ascii/classes android/scripts/android/AsciiInput.java android/scripts/android/AsciiInputStream.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-ascii/input.jar android/app/build/environment-ascii/classes/com/forcemind/chatgpt/pocinput/*.class
      - name: Compile the existing Android9 touch helper outside the APK
        if: matrix.api == 28
        run: |
          mkdir -p android/app/build/environment-touch/classes
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
      - name: Enable the existing owned emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run the approved original-package flow on fresh Android9
        if: matrix.api == 28
        run: bash android/scripts/run-environment-api28.sh "$STUDIO_REGULAR_VALIDATION_SCRIPT"
      - name: Run the approved original-package flow on fresh Android15
        if: matrix.api == 35
        run: bash android/scripts/run-environment-api35.sh "$STUDIO_REGULAR_VALIDATION_SCRIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regular-environment-${{ matrix.api }}
          retention-days: 14
          if-no-files-found: error
          path: android/app/build/regular-environment-evidence/
  deliver:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, accept]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0
      - uses: actions/download-artifact@v4
        with:
          name: regular-unsigned-review
          path: android/app/build/regular-review
      - uses: actions/download-artifact@v4
        with:
          name: regular-environment-28
          path: android/app/build/regular-environment-evidence/api28
      - uses: actions/download-artifact@v4
        with:
          name: regular-environment-35
          path: android/app/build/regular-environment-evidence/api35
      - name: Gate the review artifact on both fresh compatibility proofs
        run: |
          if [ "${{ inputs.validation_suite }}" = navigation ]; then
            python3 android/scripts/deliver-regular-navigation.py
          else
            python3 android/scripts/deliver-regular-review.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Studio-Android-${{ needs.build.outputs.version_name }}-${{ inputs.validation_suite || 'compatibility' }}-UNSIGNED-REVIEW
          retention-days: 14
          if-no-files-found: error
          path: android/app/build/regular-review-delivery/
