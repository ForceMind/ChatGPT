name: macOS release build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Confirm architecture
        run: test "$(uname -m)" = arm64
      - name: Install and build
        working-directory: desktop
        run: |
          npm ci
          npm run dist:mac
      - name: Verify and index package
        working-directory: desktop
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import crypto from 'node:crypto'; import {execFileSync} from 'node:child_process';
          const build=JSON.parse(fs.readFileSync('release/build-info.json','utf8'));
          execFileSync('codesign',['--verify','--deep','--strict',build.appPath],{stdio:'inherit'});
          const asar=(await import('@electron/asar')).default;
          const archive=path.join(build.appPath,'Contents/Resources/app.asar');
          const files=asar.listPackage(archive).filter(p=>p.startsWith('/dist/') && !fs.statSync(path.join('.',p.slice(1))).isDirectory());
          const payload={}; for(const file of files) payload[file.slice(1)]=crypto.createHash('sha256').update(asar.extractFile(archive,file.slice(1))).digest('hex');
          fs.mkdirSync('release/github-assets',{recursive:true});
          const artifacts=[];
          for(const ext of ['dmg','zip']) { const item=build.artifacts.find(a=>a.file.endsWith('.'+ext)); const file='ChatGPT-Profiles-'+build.version+'-mac-arm64.'+ext; fs.copyFileSync('release/'+item.file,'release/github-assets/'+file);artifacts.push({file,sha256:item.sha256}); }
          fs.writeFileSync('release/github-assets/mac-release-info.json',JSON.stringify({version:build.version,commit:process.env.GITHUB_SHA,signing:build.signing,payload,artifacts},null,2)+'\n');
          JS
      - name: Upload to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v3.0.0-alpha.1 --json isDraft --jq '.isDraft')" = true
          gh release upload v3.0.0-alpha.1 desktop/release/github-assets/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release-info
          path: desktop/release/github-assets/mac-release-info.json
