name: macOS release build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release matching the package version
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - name: Confirm architecture
        run: test "$(uname -m)" = arm64
      - name: Configure hosted desktop for real UI viewport checks
        run: |
          clang desktop/scripts/ci-display.c -framework CoreGraphics -framework CoreFoundation -o "$RUNNER_TEMP/studio-ci-display"
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
          "$RUNNER_TEMP/studio-ci-display"
          "$RUNNER_TEMP/studio-ci-display" --check
      - name: Verify draft target before building
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if(process.env.RELEASE_TAG!=='v'+JSON.parse(fs.readFileSync('desktop/package.json')).version)throw Error('Release tag/version mismatch')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
      - name: Install and build
        working-directory: desktop
        run: |
          npm ci
          npm run check
      - name: Handoff and asset interaction acceptance
        working-directory: desktop
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/ui-results.json
        run: npx playwright test tests/handoff.e2e.ts tests/handoff-richtext.e2e.ts tests/asset-interactions.e2e.ts tests/branding.e2e.ts --reporter=list,json
      - name: Fetch pinned alpha.18 package for real legacy installer acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.0.0-alpha.18 --pattern ChatGPT-Profiles-3.0.0-alpha.18-mac-arm64.zip --dir "$RUNNER_TEMP/studio-legacy18"
          python3 - <<'PY'
          import os,pathlib
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('STUDIO_LEGACY_UPDATE_ZIP='+os.environ['RUNNER_TEMP']+'/studio-legacy18/ChatGPT-Profiles-3.0.0-alpha.18-mac-arm64.zip\n')
          PY
      - name: Package and verify macOS installers
        working-directory: desktop
        run: |
          node scripts/icon.mjs
          node scripts/package-mac.mjs
          node --import tsx scripts/verify-mac-update.ts
          node scripts/verify-recovery-package.mjs
          node scripts/verify-menubar-package.mjs
      - name: Verify and index package
        working-directory: desktop
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import path from 'node:path'; import crypto from 'node:crypto'; import {execFileSync} from 'node:child_process';
          const build=JSON.parse(fs.readFileSync('release/build-info.json','utf8'));
          execFileSync('codesign',['--verify','--deep','--strict',build.appPath],{stdio:'inherit'});
          const asar=(await import('@electron/asar')).default;
          const archive=path.join(build.appPath,'Contents/Resources/app.asar');
          const files=asar.listPackage(archive).filter(p=>p.startsWith('/dist/') && !fs.statSync(path.join('.',p.slice(1))).isDirectory());
          const payload={}; for(const file of files) { const packed=asar.extractFile(archive,file.slice(1)); if(!packed.equals(fs.readFileSync(file.slice(1))))throw Error('Bundle/source mismatch: '+file); payload[file.slice(1)]=crypto.createHash('sha256').update(packed).digest('hex'); }
          fs.mkdirSync('release/github-assets',{recursive:true});
          fs.copyFileSync('release/verification/packaged-update.json','release/github-assets/mac-update-verification.json');
          fs.copyFileSync('release/verification/recovery-package.json','release/github-assets/mac-recovery-verification.json');
          const ui=JSON.parse(fs.readFileSync('test-results/ui-results.json','utf8'));
          fs.writeFileSync('release/github-assets/mac-ui-verification.json',JSON.stringify({version:build.version,commit:process.env.GITHUB_SHA,scope:'isolated Electron with real ProseMirror and loopback fixtures; no live ChatGPT or personal accounts',stats:ui.stats},null,2)+'\n');
          const artifacts=[];
          for(const file of ['ChatGPT-Studio-'+build.version+'-mac-arm64.dmg','ChatGPT-Studio-'+build.version+'-mac-arm64.zip','ChatGPT-Profiles-'+build.version+'-mac-arm64.zip']) { const item=build.artifacts.find(a=>a.file===file); if(!item)throw Error('Missing release file: '+file); fs.copyFileSync('release/'+file,'release/github-assets/'+file);artifacts.push({file,platform:'macos',purpose:file.startsWith('ChatGPT-Profiles-')?'legacy-updater':'installer',bytes:fs.statSync('release/'+file).size,sha256:item.sha256,url:process.env.RELEASE_TAG?'https://github.com/'+process.env.GITHUB_REPOSITORY+'/releases/download/'+process.env.RELEASE_TAG+'/'+file:undefined}); }
          fs.writeFileSync('release/github-assets/mac-release-info.json',JSON.stringify({version:build.version,commit:process.env.GITHUB_SHA,signing:build.signing,payload,artifacts},null,2)+'\n');
          const verification=name=>JSON.parse(fs.readFileSync('release/github-assets/'+name,'utf8'));
          fs.writeFileSync('release/github-assets/release-info.json',JSON.stringify({version:build.version,sourceCommit:process.env.GITHUB_SHA,prerelease:true,platforms:['macOS arm64'],ciRun:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,artifacts,signing:build.signing,checks:{distFilesCompared:Object.keys(payload).length,uiAcceptance:verification('mac-ui-verification.json'),packagedUpdater:verification('mac-update-verification.json'),nativeRecovery:verification('mac-recovery-verification.json'),nativeMenuBar:JSON.parse(fs.readFileSync('release/verification/menu-bar-package.json','utf8'))}},null,2)+'\n');
          fs.writeFileSync('release/github-assets/SHA256SUMS.txt',fs.readdirSync('release/github-assets').sort().map(file=>crypto.createHash('sha256').update(fs.readFileSync('release/github-assets/'+file)).digest('hex')+'  '+file).join('\n')+'\n');
          JS
      - name: Upload to draft
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release upload "$RELEASE_TAG" desktop/release/github-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release-info
          path: |
            desktop/release/github-assets/mac-release-info.json
            desktop/release/github-assets/mac-update-verification.json
            desktop/release/github-assets/mac-recovery-verification.json
            desktop/release/github-assets/mac-ui-verification.json
            desktop/release/github-assets/release-info.json
            desktop/release/github-assets/SHA256SUMS.txt
            desktop/release/verification/menu-bar-package.json
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-dmg
          compression-level: 0
          retention-days: 30
          path: desktop/release/github-assets/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-zip
          compression-level: 0
          retention-days: 30
          path: desktop/release/github-assets/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-ui-evidence
          retention-days: 14
          path: |
            desktop/test-results/
            desktop/release/verification/menu-bar-package.json
            desktop/release/verification/macos-menu-bar-package.png
