    - uses: actions/download-artifact@v4
      with:
        name: environment-client-input
        run-id: "${{ github.run_id }}"
        github-token: "${{ github.token }}"
        path: android/app/build/environment-client-input
    - uses: actions/download-artifact@v4
      with:
        name: gecko-network-fixture
        run-id: "${{ github.run_id }}"
        github-token: "${{ github.token }}"
        path: android/network-poc/secure-fixture
    - uses: actions/download-artifact@v4
      with:
        name: gecko-network-host-core
        run-id: "${{ github.run_id }}"
        github-token: "${{ github.token }}"
        path: android/network-poc/corebridge/bin
    - uses: actions/download-artifact@v4
      if: matrix.api == 28
      with:
        name: beta-continuation-input
        run-id: 41993581770
        github-token: "${{ github.token }}"
        path: android/app/build/environment-provider-input
    - name: Start owned legacy WebView route fixtures
      run: |
        mkdir -p "$STUDIO_GECKO_OUTPUT"
        chmod +x android/network-poc/corebridge/bin/xray
        python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture --new-file-transports > "$RUNNER_TEMP/formal-network-fixture.log" 2>&1 &
