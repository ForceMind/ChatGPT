name: Compare the 2241 Android Go core registrations
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  compare-core:
    if: github.ref == 'refs/heads/validation/android-core-slim'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
        cache: false
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Build baseline and trimmed arm64 with one toolchain
      shell: bash
      run: |
        sdkmanager 'ndk;28.2.13676358' 'platforms;android-37.0'
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
        mobile_version=v0.0.0-20261011034528-197770444867
        go install "golang.org/x/mobile/cmd/gomobile@$mobile_version"
        go install "golang.org/x/mobile/cmd/gobind@$mobile_version"
        export PATH="$(go env GOPATH)/bin:$PATH"
        output="$RUNNER_TEMP/studio-core-comparison"
        mkdir -p "$output/base" "$output/lean"
        git archive HEAD^ android/network-poc/corebridge | tar -x -C "$output/base"
        mkdir -p "$output/lean/android/network-poc"
        cp -R android/network-poc/corebridge "$output/lean/android/network-poc/corebridge"
        for variant in base lean; do
          (
            cd "$output/$variant/android/network-poc/corebridge"
            go mod tidy
            go mod verify
            if [ "$variant" = lean ]; then go test -v -timeout 120s ./... | tee "$output/lean-tests.log"; fi
            go get "golang.org/x/mobile@$mobile_version"
            gomobile bind -trimpath -ldflags='-checklinkname=0 -s -w -extldflags=-Wl,-z,max-page-size=16384' -javapkg=studio -target=android/arm64 -androidapi=28 -o "$output/$variant.aar" .
          )
        done
    - name: Verify bridge API and native library size
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import hashlib, json, os, subprocess, zipfile
        root = Path(os.environ['RUNNER_TEMP']) / 'studio-core-comparison'
        result, apis = {}, []
        for variant in ('base','lean'):
            with zipfile.ZipFile(root / (variant+'.aar')) as archive:
                item = archive.getinfo('jni/arm64-v8a/libgojni.so')
                jar = root / (variant + '.jar')
                jar.write_bytes(archive.read('classes.jar'))
                apis.append(subprocess.check_output(['javap','-public','-classpath',str(jar),'studio.networkcore.Networkcore']))
                result[variant] = {'nativeBytes':item.file_size,'aarBytes':(root/(variant+'.aar')).stat().st_size}
        assert apis[0] == apis[1]
        result['bytesSaved'] = result['base']['nativeBytes'] - result['lean']['nativeBytes']
        result['apiUnchanged'] = True
        result['androidAppTested'] = False
        result['sourceSHA'] = os.environ['GITHUB_SHA']
        (root/'report.json').write_text(json.dumps(result,indent=2)+'\n')
        print(json.dumps(result,indent=2))
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-core-registration-comparison
        path: |
          ${{ runner.temp }}/studio-core-comparison/lean-tests.log
          ${{ runner.temp }}/studio-core-comparison/report.json
