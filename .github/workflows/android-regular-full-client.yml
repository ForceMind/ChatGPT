        api-level: 28
        target: default
        arch: x86_64
        profile: pixel_2
        disable-animations: true
        emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          -writable-system -memory 3072"
        script: |
          python3 android/network-poc/scripts/install-webview.py --provider android/app/build/environment-provider-input/provider --output android/app/build/gecko-network-evidence/provider
          adb push android/app/build/environment-ascii/input.jar /data/local/tmp/studio-poc-ascii-input.jar
          adb push android/app/build/environment-touch/input.jar /data/local/tmp/studio-poc-input.jar
          python3 android/scripts/run-regular-webview-network.py
    - name: Run the same approved network scenarios on ready Android15
      if: matrix.api == 35
      run: bash android/scripts/run-environment-api35.sh android/scripts/run-regular-webview-network.py
    - name: Preserve owned node process logs even after the first error
      if: always()
      run: |
        mkdir -p "$STUDIO_GECKO_OUTPUT/node-logs"
        if [ -f "$RUNNER_TEMP/studio-owned-tcp.pid" ]; then
          studio_capture_pid=$(cat "$RUNNER_TEMP/studio-owned-tcp.pid")
          if kill -0 "$studio_capture_pid" 2>/dev/null; then
            sudo kill -INT "$studio_capture_pid"
            if timeout 5 tail --pid="$studio_capture_pid" -f /dev/null; then
              echo 'exited-after-interrupt' > "$STUDIO_GECKO_OUTPUT/owned-tcp-capture-stop.txt"
            else
              echo 'exit-not-observed-within-budget' > "$STUDIO_GECKO_OUTPUT/owned-tcp-capture-stop.txt"
            fi
          fi
        fi
        if compgen -G 'android/network-poc/secure-fixture/fixture-*.log' > /dev/null; then
          cp android/network-poc/secure-fixture/fixture-*.log "$STUDIO_GECKO_OUTPUT/node-logs/"
        fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: regular-webview-workbench-${{ matrix.api }}
        retention-days: 14
        path: android/app/build/regular-webview-workbench-evidence/
  deliver:
    if: github.event_name == 'workflow_dispatch'
    needs:
    - build
    - accept
    - navigation
    - gecko-network
    - gecko-local-exports
    - gecko-handoff
    - webview-network
    - webview-workbench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDIO_REGULAR_CI_CERT_SHA256: "${{ needs.build.outputs.ci_signer }}"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools build-tools;35.0.0
    - uses: actions/download-artifact@v4
      with:
        name: regular-unsigned-review
        path: android/app/build/regular-review
    - uses: actions/download-artifact@v4
      with:
        name: regular-environment-28
        path: android/app/build/regular-environment-evidence/api28
    - uses: actions/download-artifact@v4
      with:
        name: regular-navigation-28
        path: android/app/build/regular-navigation-evidence/api28
    - uses: actions/download-artifact@v4
      with:
        name: regular-environment-35
        path: android/app/build/regular-environment-evidence/api35
    - uses: actions/download-artifact@v4
      with:
        name: regular-navigation-35
        path: android/app/build/regular-navigation-evidence/api35
    - uses: actions/download-artifact@v4
      with:
        name: environment-client-input
        path: input
    - uses: actions/download-artifact@v4
      with:
        pattern: gecko-network-??-*
        path: acceptance/network
    - uses: actions/download-artifact@v4
      with:
        pattern: gecko-local-exports-??
        path: acceptance/local-exports
    - uses: actions/download-artifact@v4
      with:
        pattern: gecko-handoff-??
        path: acceptance/handoff
    - uses: actions/download-artifact@v4
      with:
        pattern: regular-webview-network-??-*
        path: acceptance/webview-network
    - uses: actions/download-artifact@v4
      with:
        pattern: regular-webview-workbench-??
        path: acceptance/workbench
    - name: Require all compatibility, navigation, route, file and Skill evidence
      run: python3 android/scripts/deliver-regular-full-client.py
    - uses: actions/upload-artifact@v4
      with:
        name: ChatGPT-Studio-Android-${{ needs.build.outputs.version_name }}-FULL-CHECKS-UNSIGNED-REVIEW
        retention-days: 14
        if-no-files-found: error
        path: candidate/
