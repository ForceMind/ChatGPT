name: Android 2241 single-window readiness retry
'on': workflow_dispatch
permissions:
  contents: read
  actions: read
env:
  STUDIO_ANDROID_CI_TARGET: regular
  STUDIO_REGULAR_VALIDATION_SCRIPT: android/scripts/measure-regular-optimization.py
jobs:
  resources:
    if: github.ref == 'refs/heads/validation/android-2241-resources'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api:
        - 28
        pages:
        - 1
        load:
        - stream
    steps:
    - uses: actions/checkout@v4
    - name: Bind the exact approved resource entry in disposable bootstraps
      run: python3 android/scripts/prepare-regular-resource-driver.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Prepare the existing fixture tools
      run: |
        sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libnss3-tools
    - uses: actions/download-artifact@v4
      with:
        name: regular-environment-ci-input
        run-id: 43079361850
        github-token: ${{ github.token }}
        path: android/app/build/regular-environment-input
    - name: Bind the test fixture and the 2241 production source
      run: |
        python3 - <<'PYCODE'
        import hashlib, json, os, pathlib, re
        root = pathlib.Path('android/app/build')
        folder = root / 'regular-environment-input'
        receipt = json.loads((folder / 'receipt.json').read_text())
        assert receipt['sourceSHA'] == '873b8c8bcfc35f7e090fe402c0a9e475a1d27e8c' and receipt['ciOnly'] is True
        assert receipt['productionSignatureVerified'] is False
        apk = folder / receipt['file']
        with apk.open('rb') as stream:
            assert hashlib.file_digest(stream, 'sha256').hexdigest() == receipt['sha256']
        signer = receipt['signerSHA256']
        assert re.fullmatch('[a-f0-9]{64}', signer)
        origin = {
            'schema': 1, 'complete': True, 'mode': 'single', 'parentRun': 43079361850,
            'appSourceSHA': receipt['sourceSHA'], 'productionSourceSHA': 'b1ac1c1182e1fa93ba5e9b10eb547d1f8a128706',
            'productionVersion': '2026.11.11-2241', 'fixtureSHA256': receipt['sha256'],
            'ciSigner': signer, 'releaseAPKInstalled': False, 'minified': False,
        }
        (root / 'resource-origin.json').write_text(json.dumps(origin, indent=2) + '\n')
        version = root / 'resource-android-version.json'
        version.write_text(json.dumps(receipt['versionMetadata'], indent=2) + '\n')
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            env.write(f'STUDIO_REGULAR_CI_CERT_SHA256={signer}\n')
            env.write(f'STUDIO_ANDROID_VERSION_FILE={version.resolve()}\n')
        PYCODE
    - uses: actions/download-artifact@v4
      if: matrix.api == 28
      with:
        name: beta-continuation-input
        run-id: 41993581770
        github-token: "${{ github.token }}"
        path: android/app/build/environment-provider-input
    - name: Compile the existing native ASCII helper outside the APK
      run: |
        mkdir -p android/app/build/environment-ascii/classes
        javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-ascii/classes android/scripts/android/AsciiInput.java android/scripts/android/AsciiInputStream.java
        "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-ascii/input.jar android/app/build/environment-ascii/classes/com/forcemind/chatgpt/pocinput/*.class
    - name: Compile the existing Android9 touch helper outside the APK
      if: matrix.api == 28
      run: |
        mkdir -p android/app/build/environment-touch/classes
        javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d android/app/build/environment-touch/classes android/scripts/android/TouchInput.java
        "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output android/app/build/environment-touch/input.jar android/app/build/environment-touch/classes/com/forcemind/chatgpt/pocinput/TouchInput.class
    - name: Enable the existing owned emulator acceleration
      run: |
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
    - name: Measure two fixed windows from the 2241 source baseline
      env:
        STUDIO_RESOURCE_MODE: single
        STUDIO_RESOURCE_PAGES: ${{ matrix.pages }}
        STUDIO_RESOURCE_LOAD: ${{ matrix.load }}
      run: bash android/scripts/run-environment-api${{ matrix.api }}.sh android/scripts/measure-regular-optimization.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-2241-resources-${{ matrix.api }}-${{ matrix.pages }}-${{ matrix.load }}
        retention-days: 14
        if-no-files-found: error
        path: android/app/build/regular-resource-evidence/
