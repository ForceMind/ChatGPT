name: Android Independent Network Preview
on:
  workflow_call:
    inputs:
      run_device_tests:
        type: boolean
        default: false
      run_stability_tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Owned synthetic VLESS and WebView/file routing tests (no screenshots or ChatGPT)
        type: boolean
        default: false
      run_stability_tests:
        description: With device tests enabled, run 30-minute background and recovery stability on TLS/REALITY only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  secure-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and prepare owned ephemeral identities
        run: |
          python3 -m unittest discover -s android/network-poc/scripts/tests -p 'test_secure_fixture.py' -v
          python3 android/network-poc/scripts/fixture.py --prepare-only --output android/network-poc/secure-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: network-secure-fixture
          retention-days: 1
          path: android/network-poc/secure-fixture/
  webview-provider:
    if: inputs.run_device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: android/network-poc/webview-fixture/
          key: network-api28-webview-${{ hashFiles('android/network-poc/scripts/webview-providers.json', 'android/network-poc/scripts/prepare-webview.py') }}
      - name: Verify pinned official compatible WebView
        run: |
          python3 -m unittest discover -s android/network-poc/scripts/tests -p 'test_webview_provider.py'
          sdkmanager 'build-tools;36.0.0'
          python3 android/network-poc/scripts/prepare-webview.py --output android/network-poc/webview-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: network-webview-api28
          retention-days: 14
          path: android/network-poc/webview-fixture/
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/
          key: network-core-go1273-ndk282-${{ hashFiles('android/network-poc/corebridge/go.mod', 'android/network-poc/corebridge/networkcore.go', 'android/network-poc/scripts/build-core.sh') }}
      - name: Build fixed proxy core
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;28.2.13676358' 'platforms;android-37.0' 'build-tools;36.0.0'; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash android/network-poc/scripts/build-core.sh
      - name: Collect dependency licenses
        run: |
          mkdir -p android/network-poc/app/libs/licenses
          python3 - <<'PY'
          import json, pathlib, subprocess
          text = pathlib.Path('android/network-poc/app/libs/dependencies.json').read_text()
          decoder = json.JSONDecoder()
          while text.strip():
              value, n = decoder.raw_decode(text.lstrip())
              text = text.lstrip()[n:]
              path = value.get('Dir')
              if not path: continue
              source = pathlib.Path(path)
              name = value['Path'].replace('/', '_')
              if not source.is_dir():
                  # Exact-input native caches already contain the licenses of
                  # build-only mobile modules; never silently omit one.
                  cached=list(pathlib.Path('android/network-poc/app/libs/licenses').glob(name+'_*'))
                  assert cached, 'Missing cached dependency license: '+value['Path']
                  continue
              for f in source.iterdir():
                  if f.is_file() and f.name.lower().startswith(('license', 'copying', 'notice')):
                      pathlib.Path('android/network-poc/app/libs/licenses', name+'_'+f.name).write_bytes(f.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: network-core
          retention-days: 14
          path: |
            android/network-poc/app/libs/
            android/network-poc/corebridge/bin/xray
            android/network-poc/corebridge/go.sum
  package:
    needs: [core, secure-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: network-core
          path: android/network-poc
      - uses: actions/download-artifact@v4
        with:
          name: network-secure-fixture
          path: android/network-poc/secure-fixture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile and check isolated application
        run: |
          python3 -m unittest discover -s android/network-poc/scripts/tests -p 'test_measure_resources.py'
          python3 -m unittest discover -s android/network-poc/scripts/tests -p 'test_stability_driver.py'
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          bash android/network-poc/gradlew -p android/network-poc --no-daemon :app:testPreviewDebugUnitTest :app:lintPreviewDebug :app:assemblePreviewDebug :app:assembleCiDebug :app:assembleCiDebugAndroidTest
          cp android/network-poc/THIRD_PARTY_NOTICES.md android/network-poc/app/build/reports/
          find android/network-poc/app/build/outputs/apk -name '*.apk' -exec sha256sum {} \; > android/network-poc/app/build/reports/apk-sha256.txt
      - name: Prepare independently named candidate
        run: |
          mkdir -p android/network-poc/app/build/candidate
          cp android/network-poc/app/build/outputs/apk/preview/debug/app-preview-debug.apk android/network-poc/app/build/candidate/ChatGPT-Studio-Network-Preview-0.1.0-android-arm64.apk
          cp android/network-poc/THIRD_PARTY_NOTICES.md android/network-poc/app/build/candidate/
          cp LICENSE android/network-poc/app/build/candidate/LICENSE-ChatGPT-Studio
          cp android/network-poc/app/libs/dependencies.json android/network-poc/app/build/candidate/
          cp -R android/network-poc/app/libs/licenses android/network-poc/app/build/candidate/
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging android/network-poc/app/build/candidate/*.apk > android/network-poc/app/build/candidate/apk-badging.txt
          cp android/network-poc/app/build/candidate/apk-badging.txt android/network-poc/app/build/reports/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          folder=pathlib.Path('android/network-poc/app/build/candidate')
          apk=next(folder.glob('*.apk'))
          badging=(folder/'apk-badging.txt').read_text()
          assert "package: name='com.forcemind.chatgpt.networkpreview'" in badging
          sdk=re.search(r"(?:min)?sdkVersion:'([0-9]+)(?:\.([0-9]+))?'",badging,re.IGNORECASE)
          assert sdk and int(sdk[1])==28 and int(sdk[2] or 0)==0, badging
          with zipfile.ZipFile(apk) as z:
              libraries={n:z.getinfo(n).file_size for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert not any('network_fixture_ca' in n for n in z.namelist()), 'CI authority leaked into preview resources'
              assert not any(b'GeneratedFixtureCa' in z.read(n) for n in z.namelist() if n.endswith('.dex')), 'CI authority code leaked into preview'
          assert any('/arm64-v8a/' in n for n in libraries)
          assert not any('/x86_64/' in n for n in libraries)
          (folder/'candidate.json').write_text(json.dumps({'sourceSha':os.environ['GITHUB_SHA'],
              'apk':apk.name,'bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
              'libraries':libraries,'productionSigning':False,'formalAppModified':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Studio-Network-Preview-0.1.0-android
          retention-days: 14
          path: android/network-poc/app/build/candidate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-application
          retention-days: 14
          path: |
            android/network-poc/app/build/outputs/apk/
            android/network-poc/app/build/test-results/
            android/network-poc/app/build/reports/
  device:
    if: inputs.run_device_tests
    needs: [core, package, webview-provider, secure-fixture]
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
        transport: ${{ fromJSON(inputs.run_stability_tests && '["tls","reality"]' || '["raw","tls","reality"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.run_stability_tests && 60 || 25 }}
    env:
      NETWORK_TEST_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: network-core
          path: android/network-poc
      - uses: actions/download-artifact@v4
        with:
          name: network-application
          path: android/network-poc/app/build
      - uses: actions/download-artifact@v4
        with:
          name: network-secure-fixture
          path: android/network-poc/secure-fixture
      - uses: actions/download-artifact@v4
        if: matrix.api == 28
        with:
          name: network-webview-api28
          path: android/network-poc/webview-fixture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Start owned VLESS fixtures
        run: |
          chmod +x android/network-poc/corebridge/bin/xray
          mkdir -p android/network-poc/evidence
          python3 android/network-poc/scripts/fixture.py --core android/network-poc/corebridge/bin/xray --output android/network-poc/secure-fixture > "$RUNNER_TEMP/network-fixture.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if [ -f android/network-poc/secure-fixture/ready.json ]; then break; fi
            sleep 1
          done
          test -f android/network-poc/secure-fixture/ready.json
          cp android/network-poc/secure-fixture/fixture.json android/network-poc/evidence/fixture.json
      - name: Enable hardware acceleration on disposable runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 28 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -writable-system
          script: |
            if [ '${{ matrix.api }}' = 28 ]; then python3 android/network-poc/scripts/install-webview.py --provider android/network-poc/webview-fixture --output android/network-poc/evidence/provider-upgrade; fi
            if [ '${{ inputs.run_stability_tests }}' = true ]; then bash android/network-poc/scripts/device-stability.sh; else bash android/network-poc/scripts/device-test.sh; fi
            if [ '${{ inputs.run_stability_tests }}' != true ]; then python3 android/network-poc/scripts/measure-resources.py --transport '${{ matrix.transport }}' --fixture android/network-poc/secure-fixture/fixture.json --output android/network-poc/evidence/resources; fi
      - name: Preserve stability fixture log after success or failure
        if: always() && inputs.run_stability_tests
        run: |
          mkdir -p android/network-poc/evidence
          cp "$RUNNER_TEMP/network-fixture.log" android/network-poc/evidence/fixture.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.run_stability_tests && 'network-stability' || 'network-device' }}-api-${{ matrix.api }}-${{ matrix.transport }}
          retention-days: 14
          path: android/network-poc/evidence/
